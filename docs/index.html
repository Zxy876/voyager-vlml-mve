## 里程碑与技能的关系

原版 Voyager 中技能和里程碑是**同一件事的两种记账**——任务文本进了 `completed_tasks`（里程碑），解法进了技能库（技能），下一轮出题时又用任务文本把解法检索回来。MVE 同构落地：

```mermaid
flowchart TD
    A[维度闭合] --> B[skill_store.add]
    B --> C[skill: topic_id::dim_id]
    A --> D[闭合计数+1]
    D --> E{所有维度闭合?}
    E -->|是| F[里程碑点亮]
    F --> G[可被下一轮检索复用]
    C --> G
```

| 原版 | MVE 落地 | 差异 |
|---|---|---|
| `completed_tasks` 列表 + `progress=len()` | `run_log.jsonl` + `loop_state.json` 的 `progress` | 额外落盘为面板可读 |
| `program_code`（JS 源码） | 技能库的 `code` 字段 = 一整条 SQL 配方 | VLML 世界里"代码"就是取数 SQL |
| `skill_description`（LLM 生成） | `text` 字段（一句话方法，带题面） | 检索键更实 |
| Chroma 向量检索，键=任务文本 | 词面 Jaccard 相似 + topic 预过滤 | 无向量库环境的近似 |
| 同名 Rewriting | `add()` 的 `rewritten` 分支（`DUP_THRESHOLD=0.62`） | 相似度去重 |

**技能名 = 关联的问题**在 MVE 已经是事实——`skill_store` 的 key = `topic_id::dim_id`，维度 id 是精确主键，不许相似度合并（`exact_only=True`）。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796), [docs/maieutic-外包课程规划.md:302-349](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/maieutic-外包课程规划.md#L302-L349)

## intent-diff 与漂移判定

`intent-diff` 是骨架闭环中的关键判据层，三类漂移的判定逻辑：

```mermaid
sequenceDiagram
    participant V as Voyager
    participant C as Critic
    participant ID as intent-diff
    participant SK as 技能库

    V->>+C: 提交答案+代码
    C->>C: ok1 = check_task_success
    C-->>-V: verdict + critique

    alt ok1 = True
        V->>+ID: 代码 vs 承诺维度
        ID->>ID: 分类: drift/revision/bug
        alt 分类 = drift
            ID-->>V: 漏掉维度 → 不闭合成技能
        else 分类 = revision
            ID-->>V: 换法但满足承诺 → 可闭合
        else 分类 = bug
            ID-->>V: 机械失败 → 不闭合
        end
    else ok1 = False
        C-->>V: 失败反馈 + 反问
    end

    opt 全维度闭合
        V->>SK: add_new_skill(每维度一条)
    end
```

**关键纪律**：`classification`（drift/revision/bug）**不进学生面**——只进 `run_log` / 教师面，与原版 `intent-diff.ts:16-18` 的可见边界规则同一口径。

Sources: [docs/maieutic-外包课程规划.md:302-349](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/maieutic-外包课程规划.md#L302-L349), [mve/maieutic_scaffold.py:28-34](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/maieutic_scaffold.py#L28-L34)

## 骨架与知识图谱的协作

骨架产出的维度与知识图谱节点存在映射关系，图谱回答"**这个维度该调哪个工具**"：

```mermaid
flowchart TD
    A[骨架: dimensions] --> B[维度节点]
    C[知识图谱] --> D[工具节点]
    C --> E[表节点]
    B -->|produced_by| D
    D -->|derived_from| E
    B -->|confusable| B2[其它维度]
    D -->|co_occurs| D2[其它工具]
```

| 图谱元素 | 作用 | 来源 |
|---|---|---|
| 维度节点 | 骨架产出的学习子目标 | `TASKS[].rubric` |
| 工具节点 | 回答"该调哪个工具" | `answer_spec.tool` |
| 表节点 | 回答"数据从哪来" | 解析 `answer_spec.sql` 的表名 |
| `produced_by` 边 | 维度由哪个工具产出 | `loop_core.py` 声明 |
| `derived_from` 边 | 工具读哪些表 | SQL 解析 + VLML 建模表对账 |
| `confusable` 边 | 同题"同后缀不同前缀"的维度 | 实测提取 |

Sources: [知识图谱与求助闭环.md:272-368](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L272-L368), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

## 课程调度：驾驶舱与范围

驾驶舱（`scene_learn.py`）围绕里程碑与维度进行调度：

| 状态 | 行为 |
|---|---|
| 有未完成里程碑 | 选「未闭合维度」优先 |
| 全闭合后 | 降级自由出题 |
| 人在面板问一句 | `set_current_target` 换锚（设计，非 bug） |

### 练习范围

照伴学 `study_set_practice_scope` 实现，图谱页点维度设范围：

| 伴学 | MVE |
|---|---|
| 点一个知识点设练习范围 | 图谱页点维度（或清单按钮）设范围 |
| `study_set_practice_scope`：canonical 校验 + `scope_revision` 递增 | `practice_scope.set_scope()`：维度必须在当前图谱里 |
| `study_get_practice_scope`：读时重新校验 | `get_scope()`：图谱重建过 → 返回 `invalidated + 原因` |
| `filter_question_params_to_scope`：范围内错题优先 | `tasks.next_topic(only=...)`：错题 → 没做过 → 难度升序 |

**驾驶舱只剩开始/停止**：有范围 → `once`（范围里最优的一题跑透）；没范围 → `loop`（出题器连续自适应出题）。

Sources: [知识图谱与求助闭环.md:185-298](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L185-L298), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

## 关键教训总结

1. **骨架只拆一次**——重拆会导致维度 id 每轮变，闭合账全对不上
2. **提示打不过强先验，得换成约束**——B 组把完整骨架+致命错法写进 prompt，模型五次一字不改；加 SQL 结构断言后一次改对
3. **给"做法描述"没用，给"编排序列"才有用**——注入 2 条技能后轨迹仍是一步；补上 `_blueprint_hint` 后轨迹变成两步，行为真的改了
4. **"调对了工具"不等于"取得到值"**——还需参数断言（语义必传 + 类型检查）
5. **drift 不该闭合成技能**——这是「跑通 ≠ 口径对」的机器化判据

Sources: [知识图谱与求助闭环.md:272-368](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L272-L368), [进度对照.md:902-992](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L902-L992), [docs/maieutic-外包课程规划.md:302-349](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/maieutic-外包课程规划.md#L302-L349)

助产士追问骨架与课程体系是 MVE 学习闭环的起点与骨架：它将粗糙材料拆解为可逐个闭合的维度，通过里程碑机制追踪学习进度，通过 intent-diff 三分类判定漂移性质，最终将闭合的维度结晶为可复用的技能。其核心设计原则——骨架只拆一次、维度与复杂度成比例、drift 不闭合为技能——均源自对原版 Maieutic 系统的同构映射与实测验证，确保了学习闭环的可对账性与技能库的可靠性。

# 场景隔离与数据源管理

MVE 系统采用 **1→n 可插拔场景**架构，每个场景拥有独立的数据源、技能库、知识图谱和学习进度。场景隔离的核心设计原则是：**不同场景之间绝不共享数据、绝不回退到默认库**。这一机制源自用户 2026-10-19 的两条硬性要求——"启动 voyager 学习时场景隔离，只学习当前场景"以及"在别的场景下，voyager 的学习和 VLML 没有关系"。场景隔离不仅体现在数据层（不同数据库/文件），还贯穿于技能库、知识图谱、掌握度账本、课程骨架等所有学习产出物中。

Sources: [mve/scene_profile.py:1-77](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_profile.py#L1-L77), [mve/learn_orchestrate.py:675-709](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/learn_orchestrate.py#L675-L709), [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

## 场景后端分类

`scene_profile.py` 是场景→学习后端的**唯一判定处**，返回四种 `kind`：

| kind | 含义 | 数据源 | 适用场景 |
|---|---|---|---|
| `vlml` | VLML 数据域 | 当前 VLML 库（rib/vlr，面板可切） | Scene A（默认场景） |
| `scene` | 场景显式配了 `data_source` | 场景自配的 `.duckdb` 路径 | 有独立数据库的场景（B/C） |
| `local` | 本机数据源 | 场景目录里的文件（csv/json/duckdb）+ 本机只读原语 | 非默认、未配库的场景 |
| `missing` | 配了路径但文件不存在 | 无（不可达） | 配置错误 |

关键设计决策：**非默认场景不"继承默认库"，而是走本机**。历史教训：Scene B 导入"现在最前沿的世界模型是什么"后，取数走了 rib.gg 的 Valorant 表，答案列出了 G2 Esports / LOUD 等战队名——场景隔离在图谱和技能上成立了，在数据源上根本不成立。

Sources: [mve/scene_profile.py:1-77](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_profile.py#L1-L77), [mve/learn_orchestrate.py:675-709](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/learn_orchestrate.py#L675-L709)

### 判定流程

```mermaid
flowchart TD
    A[输入 scene_id] --> B{是否为空?}
    B -->|是| C[取默认场景ID]
    B -->|否| D[使用输入 scene_id]
    C --> D
    D --> E{是否为默认场景A?}
    E -->|是| F[kind = vlml]
    E -->|否| G{场景配了data_source?}
    G -->|否| H[kind = local]
    G -->|是| I{文件是否存在?}
    I -->|否| J[kind = missing]
    I -->|是| K{是否为.duckdb?}
    K -->|是| L[kind = scene]
    K -->|否| H
```

`profile()` 函数返回 `{scene_id, kind, db_path, tables, why}`，其中 `db_path` 只对 `kind=vlml/scene` 有值。VLML 取的是 `db_switch.current_path()`（面板可切），scene 取场景自配路径。

Sources: [mve/scene_profile.py:60-77](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_profile.py#L60-L77)

## 学习循环中的场景隔离

在 `learn_orchestrate.py` 的学习主循环中，场景隔离在 ⓪ 步强制锁定：

```mermaid
flowchart TD
    A[学习循环启动] --> B[⓪ 场景隔离: 锁定后端]
    B --> C{profile.kind?}
    C -->|vlml| D[VLML后端: rib库 + VLML工具集]
    C -->|scene| E[场景库: 只读自配.duckdb]
    C -->|local| F[本机: 场景目录文件 + 只读原语]
    C -->|missing| G[status=unreachable, 终止]
    D --> H[执行学习]
    E --> H
    F --> H
```

三条隔离铁律：
1. **Scene A → VLML**（rib 库 / VLML 工具集）
2. **场景配了自己的库 → 只读那个库**
3. **其余 → 本机**（场景目录里的文件 + 只读原语），不需要用户配任何库

三条都不许互相借数据。

Sources: [mve/learn_orchestrate.py:675-709](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/learn_orchestrate.py#L675-L709)

## 场景层渐进披露

`scene_context.py` 将 Minecraft 的「初始场景注入」翻译成 MVE 的等价物，实现**场景层渐进披露**——独立于支架层（full/partial/none），两层正交：

| MC 元素 | MVE 等价物 | 来源 |
|---|---|---|
| biome（世界） | 数据源身份（vlml_vlr / vlml_rib / 默认库） | `db_config` |
| nearby_blocks（眼前） | 当前可见的表 + VLML 10 工具（base 层恒给，ext_* 层进度够了才给） | `information_schema` |
| inventory（背包） | 实体可填值（锚点 + 目录可选项）+ 已掌握知识点 | `anchor / entity_catalog / 掌握度` |
| chests（箱内存货） | 技能库图谱（已学会的技能/配方） | `skill_store / 掌握度` |

### 进度档位

```python
TIER_BASE = 0   # 新手：只看 base 表
TIER_EXT = 1    # 已解锁基础层：放开 ext 表
```

升到 ext 档需要已解锁若干里程碑。用**里程碑数**而不是掌握度，因为掌握度是消费侧尺子，不能进学习反馈环。

Sources: [mve/scene_context.py:1-60](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_context.py#L1-L60)

### VLML 语义工具集（跨域基线）

VLML 10 工具是跨域基线——技能/动作锁定语义层，不写裸 SQL。换库只是"该层题有没有数据"，工具集恒定，因此技能可迁移：

| 工具 | 用途 |
|---|---|
| `match_analysis_report` | 比赛分析 |
| `match_summary_report` | 比赛摘要 |
| `match_players_report` | 选手报告 |
| `match_rounds_report` | 回合报告 |
| `match_economy_report` | 经济报告 |
| `player_profile_report` | 选手档案 |
| `scouting_report` | 侦察报告 |
| `pattern_detection_report` | 模式检测 |
| `query_sql` | 自定义 SQL |
| `get_database_info` | 数据库信息 |

Sources: [mve/scene_context.py:30-42](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_context.py#L30-L42)

## 本机执行层

`local_agent.py` 为非 VLML 场景提供"本机原语 + 写代码执行"的执行层，对照猫娘（N.E.K.O）的设计：插件即能力，能力即本机，用户不需要先配一个库。

### 提供的三个只读原语

| 原语 | 功能 | 限制 |
|---|---|---|
| `list_files(path="", pattern="*")` | 列文件 | 只在场景目录内 |
| `read_file(path, max_bytes=200_000)` | 读文本 | 限定只读、限长 |
| `read_json(path)` | 读 JSON 并解析 | 同上 |
| `query_sql(sql)` | 执行 SQL | 仅当场景目录有 `.duckdb` 时可用 |

### 安全边界

- **只读**：不提供 write / delete / exec
- **路径限制在场景目录内**：禁止跳出（`..` 与绝对路径都做校验）
- **不碰操作者的家目录**：用户 2026-10-19 明确要求
- **模型写的代码在受限命名空间里跑**：禁 `import`、禁 `__builtins__` 逃逸
- **单次执行有超时**：线程 + join
- **密钥类文件一律不读不列**：`.env`、私钥、证书、凭据文件

Sources: [mve/local_agent.py:1-75](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/local_agent.py#L1-L75)

## 来源快照（环境观察面）

`source_snapshot.py` 抄的是原版 Voyager 的 `render_observation` 机制——出题器看得见环境，就不会拆出"挖不存在的东西"这种子目标。

```mermaid
flowchart TD
    A[拆维度之前] --> B[按题面点名来源取观察面]
    B --> C{来源类型?}
    C -->|file| D[读本机文件]
    C -->|url| E[URL不预取正文]
    C -->|slug| F[取仓库文件清单+README]
    C -->|table| G[归db_observation管]
    D --> H[喂给骨架生成器]
    E --> H
    F --> H
    G --> H
    H --> I[维度只指向看得见的东西]
```

### 预算与截断

| 参数 | 值 | 说明 |
|---|---|---|
| `TREE_LIMIT` | 60 | 文件清单条数上限 |
| `TEXT_LIMIT` | 2600 | 正文长度上限 |

观察面不是全文，截断时**如实标注**——让下游知道它没看完。任何失败都返回空串，退回"不许造材料里没有的东西"的约束，**绝不因取不到就少拆维度**。

Sources: [mve/source_snapshot.py:1-85](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/source_snapshot.py#L1-L85)

## 场景工作区（scene_data/）

`scene_data/` 是场景的工作区，应用自己在用，用户不用配：

- 建一个场景，这里会自动出现 `scene_data/<场景 id>/`
- 应用自己产生的数据默认落在这里
- 已有现成的 `*.json` / `*.csv` / `*.duckdb` 想一起查，丢进来即可

### 边界（刻意收紧）

- **只读**：没有 write / delete
- 只允许落在应用工作区和场景目录内
- **不读操作者的家目录**
- 模型写的代码跑在受限命名空间里：没有 `import`、没有 `open`，单次执行有超时

当本机没有数据时，系统如实说没有，不会退回 VLML/rib 库去凑答案。

Sources: [scene_data/README.md:1-27](https://github.com/Zxy876/voyager-vlml-mve/blob/main/scene_data/README.md#L1-L27)

`reset_all.py` 支持按场景清库，其它场景的学习成果、数据源、场景注册全保留：

```bash
python mve/reset_all.py --scene D
python mve/reset_all.py --scene D --dry-run
```

| 文件 | 含义 |
|---|---|
| `skill_store.json`（本场景配方） | 技能库 |
| `skill_emb.json` | 技能向量索引 |
| `topic_mastery.jsonl` | 掌握库 |
| `runtime_topics.json` | 运行期图谱节点 |
| `generated_tasks.json` | 出题器生成的题 |
| `knowledge_graph.json` | 图谱缓存 |
| `run_log.jsonl` | 运行日志 |
| `exam_log.jsonl` | 裸考记录 |
| `causal_timeline.jsonl` | 行动因果时间线 |

### 按场景清**不动**的内容

| 文件 | 原因 |
|---|---|
| `scene_data/<场景>/` | 人的本机文件——那是数据源 |
| `scenes.json` | 场景注册（清了场景就没了） |
| `action_registry.json` | 猫爪总开关 / 组开关 |
| `exam_log.jsonl`（无场景字段） | 裸考记录不带场景字段 |
| 其它场景/default 的技能配方 | 属于其它场景 |

2026-10-26 起，按场景清**会清** `source_scene=本场景` 的技能配方——旧配方残留会被 embedding 盲取检索回来，含毒配方，等于没从零学。

## 面板中的场景隔离

面板的知识图谱按场景隔离渲染——每个场景一张图，Scene A 的 360 个 Valorant 节点不画进 Scene B 的图谱，反过来也一样。空图谱是冷启动的**正常态**（只有场景根节点），不是"图谱坏了"。

```mermaid
flowchart TD
    A[面板请求图谱] --> B[build_state按scene.id过滤]
    B --> C[只返回当前场景的节点和边]
    C --> D{场景有专属节点?}
    D -->|0个| E[显示冷启动提示]
    D -->|>0个| F[渲染分层布局]
    F --> G[表 → 工具 → 维度]
```

维度节点（含孤立）必画——它是"问题插进场景"的可见证明；工具/表节点只有连边才画，避免 machinery 把图变乱。

Sources: [mve/dashboard.py:1628-1697](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/dashboard.py#L1628-L1697)

## 教学图谱中的场景感知

`topic_graph.py` 的选题器在跨域基线上做场景感知降权：依赖 `ext_*` 表的知识点（首血/经济局等），换到没有 ext 表的库（如 `vlml_vlr`）时不可答，出题器将它们降权，等换到有 ext 表的库（如 `vlml_rib`）再放开。

```python
EXT_TOPICS = {
    "vlml_first_blood", "vlml_fb_conversion", "vlml_post_plant", "vlml_economy",
    "vlml_trade", "vlml_opening_duel", "vlml_grain_trap", "vlml_sample_size",
}
```

Sources: [mve/topic_graph.py:1-82](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/topic_graph.py#L1-L82)

## 场景隔离的端到端流程

```mermaid
sequenceDiagram
    participant User as 用户
    participant Panel as 面板
    participant Profile as scene_profile
    participant Learn as learn_orchestrate
    participant Exec as 执行层
    participant Store as 技能库/图谱

    User->>Panel: 选择场景发起学习
    Panel->>Profile: profile(scene_id)
    Profile-->>Panel: {kind, db_path, ...}

    alt kind = vlml
        Panel->>Learn: 启动VLML学习
        Learn->>Exec: VLML工具集 + rib库
    else kind = scene
        Panel->>Learn: 启动场景库学习
        Learn->>Exec: 只读自配.duckdb
    else kind = local
        Panel->>Learn: 启动本机学习
        Learn->>Exec: 本机只读原语
    else kind = missing
        Profile-->>Panel: unreachable
    end

    Exec-->>Learn: 执行结果
    Learn->>Store: 按场景命名空间入库
    Store-->>Panel: 场景隔离的技能/图谱
```

Sources: [mve/learn_orchestrate.py:675-709](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/learn_orchestrate.py#L675-L709), [mve/scene_profile.py:1-77](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_profile.py#L1-L77)

## 产品级已知限制

| # | 限制 | 说明 |
|---|---|---|
| 1 | 技能绑死题目，不迁移 | 存下来的调用序列里写死了 `series_id` / 地图名，迁移考核 0% |
| 2 | 图谱不消费 `ext_*` 表 | 表节点只从种子题 rubric SQL 派生 |
| 3 | 公开源缺 `agg_*` 派生层 | 9 张派生表在公开源都是 0 行，但原料在 `ext_*` 表里 |
| 4 | `player_profile_report` 必然失败 | VLML 写死查 `agg_player_game_stats`（公开源 0 行） |
| 5 | 种子题实体写死 | 6 道任务 SQL 写死了 GRID 图名/队名，rib 库里不存在这些实体 |
| 6 | 考核线未迁新后端 | 练习线已迁，摸底/结业考仍走旧 `exam.py` |
| 7 | 掌握度挂在 `topic_id` 上 | 设计要按组合类算，代码目前按题聚合 |

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236)

## 总结

场景隔离与数据源管理是 MVE 1→n 可插拔场景架构的基石。`scene_profile.py` 作为唯一判定处，将场景严格分为 VLML/scene/local/missing 四类后端，杜绝跨场景数据泄漏。`scene_context.py` 实现场景层渐进披露，`local_agent.py` 提供安全的本机只读原语，`source_snapshot.py` 确保出题只指向环境中真实存在的事实。从学习循环（`learn_orchestrate.py`）到面板渲染（`dashboard.py`）到按场景重置（`reset_all.py`），隔离约束贯穿全链路。核心设计哲学是：**对于普通用户，数据源就是本机**——不需要配库、不需要继承默认库、不需要跨场景借数据。

# 面板与可视化

MVE 面板是整个项目的**唯一交互入口**（`/mve/`），采用单文件 HTTP 服务架构（`mve/dashboard.py`，4196 行），不建第二面板。面板的核心职责是**如实呈现学习循环的真实产出**——不做任何推断，只显示真实发生过的东西。数据聚合由 `mve/panel_data.py`（1169 行）的 `build_state()` 函数按 `scene.id` 过滤后提供，面板前端通过 `/api/*` 端点获取。

面板形态取自猫娘伴学的 static/ 前端布局模式：page-shell → hero → workspace-nav（tab 分区）→ workspace-stage（一次只显示一个面板），视觉上采用纸质卡 + 柔和阴影 + 品牌色阶，直接复用伴学的 mastery 五档色系（weak/progress/good/mastered/new）。

Sources: [mve/dashboard.py:1-78](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/dashboard.py#L1-L78), [HANDOFF.md:49-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L66), [README.md:239-280](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L239-L280)

    PanelData -->|读取| SkillStore
    PanelData -->|读取| LoopState
    PanelData -->|读取| PilotState
    PanelData -->|按 scene.id 过滤| PanelData

## 启动与部署

面板作为 systemd 常驻服务运行，改完代码**必须重启**否则跑的是旧进程：

```bash
# 服务器部署
cd /root/mve
git fetch origin && git reset --hard origin/feature/1-to-n-pluggable-scenes
systemctl restart mve-panel        # 面板 + API（内部 8777）

# 本地开发
python mve/dashboard.py            # 打开 http://127.0.0.1:8777
python mve/dashboard.py --port 9000
```

关键注意事项：
- **重启前必查** `pgrep -af 'scene_learn|pilot'`，有活循环先 `curl -X POST http://172.18.0.1:8777/mve/api/pilot/stop`
- 容器内服务只认 `http://172.18.0.1:8777`（docker 网桥），`127.0.0.1` 不通
- 面板入口：`http://43.161.203.50:8443/mve/`（Caddy 反代）

## 知识图谱自检机制

面板启动时自动执行知识图谱自检（`_ensure_knowledge_graph`），避免 `git pull` 丢 json 或换库后反复出现 "not built"：

```mermaid
graph TD
    Start["面板启动"]
    Import["导入 knowledge_graph"]
    Check{"图谱存在且<br/>未过期?"}
    Build["重建图谱<br/>_do_build_graph()"]
    Serve["正常服务"]
    Fail["标记不可用<br/>不影响启动"]

    Start --> Import
    Import --> Check
    Check -->|是| Serve
    Check -->|否/缺失| Build
    Build -->|成功| Serve
    Build -->|失败| Fail
    Import -->|异常| Fail
```

过期判据 = `schema_version` + 题指纹 + 建模文档指纹（复用 `knowledge_graph._stale`）+ 默认 duckdb 比图谱新（换库）。重建使用 `_graph_build_lock`（RLock）防止并发重建。

Sources: [mve/dashboard.py:55-78](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/dashboard.py#L55-L78)

## 知识图谱可视化

知识图谱采用**分层布局**（表 → 工具 → 维度，从左到右）而非力导向——图谱小且层次天然固定，分层可读性更好。

### 节点渲染规则

| 节点类型 | 孤立时是否渲染 | 原因 |
|---|---|---|
| 维度（dimension） | ✅ 必画 | 用户关心的知识点，冷启动导入的问题落成孤立维度 |
| 工具（tool） | ❌ 不画 | 未被任何维度用到的 machinery 不画，避免图变乱 |
| 表（table） | ❌ 不画 | 同上 |
| 已删除（deleted） | ❌ 不画 | status='deleted' 过滤掉 |

### 边类型与样式

| 关系 | 颜色 | 线型 | 语义 |
|---|---|---|---|
| `produced_by` | `#2f7d5f` 绿 | 实线 | 产出 |
| `derived_from` | `#8a94a6` 灰 | 虚线 | 由表算出 |
| `confusable` | `#c2703a` 橙 | 虚线 | 易混 |
| `co_occurs` | `#b9c2ce` 浅灰 | 虚线 | 同题共现 |
| `procedure_step` | `#6d5bd0` 紫 | 实线 | 编排顺序 |

### 场景隔离

每个场景一张图——A 的 360 个 Valorant 节点不画进 B 的图谱。空图谱（只有场景根节点）是冷启动的**正常态**，不报故障。

Sources: [mve/dashboard.py:1628-1697](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/dashboard.py#L1628-L1697), [知识图谱与求助闭环.md:409-471](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L409-L471)

## 技能库面板

技能库面板照原版 `voyager.py:195/199`：每轮**先检索**再写 SQL，按有效性排序。

### 关键指标

| 指标 | 含义 |
|---|---|
| **命中** | 被检索注入过几次 prompt |
| **有效** | 注入后这轮判成功几次 |
| **命中率涨、有效不涨** | 注入了但没帮上，检索排序里自然沉底 |
| **膨胀率** | 技能库条目数 / 有效条目数 |

## 运行控制

### 「不停」开关

同构原版 Voyager 的 `while True`——学习循环本来就不带停，只有人点停止（或跑满上限）才退。面板以前写死 `rounds:3`，一次启动只跑 3 道题就退出，29 个节点的图谱根本跑不完。

| 开关状态 | 行为 |
|---|---|
| 勾选（默认） | `rounds 0`，同构原版 `while True` |
| 取消 | 只跑一轮 |
| 有练习范围时 | 自动锁掉（范围把题钉死成一道，不停只会反复跑同一题） |

### 启停流程

```mermaid
sequenceDiagram
    participant User as 用户
    participant Panel as 面板
    participant Pilot as pilot.py
    participant Loop as loop.py

    User->>Panel: 点击「启动 Voyager」
    Panel->>Pilot: POST /api/pilot/start
    Pilot->>Loop: 启动学习循环子进程
    Loop-->>Panel: 写入 loop_state.json（心跳）

    loop 学习循环运行中
        Loop-->>Panel: 更新 loop_state.json
        Panel->>Panel: 轮询 /api/state 刷新
    end

    User->>Panel: 点击「停止」
    Panel->>Pilot: POST /api/pilot/stop
    Pilot->>Loop: SIGTERM（优雅停）
    Loop->>Loop: 跑完当前题才退
    Loop-->>Pilot: 进程退出
    Pilot-->>Panel: 状态 → 已停止
```

> ⚠️ **别连点两次启动**——会起第二个 loop.py，两个循环同时写 run_log / skill_store。

Sources: [mve/dashboard.py:396-450](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/dashboard.py#L396-L450), [docs/README-学习机制详解-2026-10-13-存档.md:1554-1653](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1554-L1653)

## 数据源管理

面板提供数据库切换功能，但换库有严格约束：

```mermaid
graph TD
    Verify["① 验货<br/>报表数/事件数/series"]
    Switch["② 切换并重启进程"]
    Patch["vlml_env.py<br/>打补丁换默认库"]
    Restart["重启面板进程"]

    Verify -->|通过| Switch
    Switch --> Patch
    Patch --> Restart
```

**已知限制**：
- VLML 工具写死 `EventDatabase(read_only=True)`（不带 db_path），补丁只在进程启动时装一次
- 题目注册表里的 `SERIES` / 队伍名是写死的，换库后这些常量要重配
- 9 张 `agg_*` 派生表在公开源都是 0 行，`player_profile_report` 必然失败

## 循环心跳条

位于运行日志 tab 顶部，读 `mve/loop_state.json`（循环写、面板只读）。因为循环是**不停**的，它不会用"退出码"告诉你状态——心跳是唯一的窗口：

| 心跳字段 | 含义 |
|---|---|
| 第几轮 | 当前迭代计数 |
| 不停 / 单轮 | 运行模式 |
| 进度几个里程碑 | 里程碑点亮数 |
| 工具成功/失败几次 | 本轮工具调用统计 |
| 取到几行 | 数据取证行数 |

连续 N 轮没拿到证据时出告警条，并按 `linkage / sql_error / empty / unproven` 给出**不同的处置建议**。

## 总结

MVE 面板是一个自包含的单文件 HTTP 服务，承担着项目**唯一交互入口**的职责。其设计遵循三个核心原则：（1）**如实呈现**——不做推断，只显示真实发生过的东西；（2）**一次一个工作区**——tab 分区避免信息过载；（3）**同构原版**——「不停」开关、技能检索排序、里程碑点亮等行为均与原版 Voyager 对齐。数据流从 `panel_data.build_state()` 聚合 JSONL 日志，经 `/api/*` 端点供给前端纯 SVG 图表渲染，全程无外部前端框架依赖。

# 后端服务与编排层

后端服务与编排层是 MVE（端侧大模型能力验证框架）的核心运行骨架，负责将 Voyager 范式的"技能习得闭环"从 Minecraft 世界迁移至真实数据库环境，并实现 1→n 可插拔场景泛化。该层包含两条核心管线——**学习线**（出题→拆解→rollout→结晶→里程碑）与**消费线**（检索→多技能编排→叙事→掌握度），以及驾驶舱调度、面板 API 服务、场景管理等支撑子系统。

编排层的核心设计原则是**习得是手段，验证是目的**：不训练模型参数，而是通过环境反馈回传判卷结论，将经验结晶为可检索、可组合、可重放的技能程序。判官 + 确定性守卫替代奖励信号，技能库替代参数更新。

Sources: [README.md:1-69](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L69), [HANDOFF.md:1-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L1-L66), [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

## 整体架构

### 双管线架构

MVE 后端由两条独立但共享技能库的管线构成：

```mermaid
graph TD
    subgraph 学习线
        A1[课程出题] --> A2[维度拆解]
        A2 --> A3[Rollout执行]
        A3 --> A4[判据+判官]
        A4 --> A5[闭合计数]
        A5 --> A6[技能结晶入库]
    end

    subgraph 消费线
        B1[用户提问] --> B2[技能检索]
        B2 --> B3[多技能编排]
        B3 --> B4[叙事聚合]
        B4 --> B5[掌握度记账]
    end

    A6 --> SKILL[(技能库)]
    SKILL --> B2
    A5 --> MILE[(里程碑)]
    MILE --> A1
```

学习线产出 SQL + 真实行数据 + 来源工具清单 + 判卷结论；消费线仅编排复用已有技能，不现做合成——"学过什么答什么，没学过就明说'未学'并踢回学习线"。

Sources: [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245), [HANDOFF.md:67-82](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L67-L82)

### 两层调度机制

两层调度是后端编排最容易抄错的核心结构，严格对照原版 Voyager 的 `learn()` / `inference()` 分层：

| 层 | 原版语义 | MVE 落地 |
|---|---|---|
| **整题层** | `learn()`：任务失败进 `failed_tasks`，换题 | 里程碑：失败 → `note_milestone_round(new_closed=0)` 挂冷却 → 降级自由出题 |
| **子目标层** | `inference()`：`while sub_goals`，题内不跳过 | 维度：逐维度重试 |

```mermaid
sequenceDiagram
    participant Pilot as 驾驶舱
    participant Learn as 整题层 learn()
    participant Infer as 子目标层 inference()
    participant Critic as 判官
    participant Skill as 技能库

    Pilot->>+Learn: 启动里程碑
    Learn->>+Infer: 拆解维度列表
    loop 逐维度重试 (MAX=4)
        Infer->>Critic: 提交执行结果
        Critic-->>Infer: verdict + coverage
        alt 判对
            Infer->>Skill: add_new_skill()
        else 判错
            Infer->>Infer: 记失败，继续下一维度
        end
    end
    Infer-->>-Learn: 本轮闭合数
    alt 全闭合
        Learn->>Pilot: 里程碑点亮
    else 未闭合
        Learn->>Learn: 冷却后换题/降级
    end
    Learn-->>-Pilot: 进度更新
```

Sources: [HANDOFF.md:123-155](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L123-L155), [docs/README-学习机制详解-2026-10-13-存档.md:92-142](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L92-L142)

### 三条铁律

1. **原版没有「整题总验收」层**：`inference()` 的完成判据只是"最后一条子目标成功"（`voyager_original/voyager.py:417`）
2. **原版对做不出的任务从不原地无限重试**：单任务封顶 `action_agent_task_max_retries=4`，MVE 封顶 `MAX_RETRY_STREAK=4`
3. **骨架拆一次就固定，永不因失败重拆**：曾按失败指纹重拆 → 维度 id 每轮变 → 闭合账全对不上

Sources: [HANDOFF.md:123-155](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L123-L155)

## 核心编排模块

### 主循环 voyager.py

`mve/voyager.py`（2582 行）是主循环入口，对应原版 `voyager.py` 的 learn/inference 两层调度。核心闭环：

```
场景(scene) → 里程碑拆维度 → 逐维度出题 → 执行(工具/MCP) → 判据+判官 → 闭合计数
   ↑                                                              ↓
   └── 技能库(配方/程序) ← generalize 去数值 ← 验对轨迹入库 ← 全闭合/部分闭合
```

关键常量：
- 内层 `INNER_MAX_ITERS=4`
- 外层 `--max-retries` 默认 1
- 外层墙钟 90s

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123), [README.md:1-69](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L69)

### 学习编排 learn_orchestrate.py

`mve/learn_orchestrate.py`（2304 行）负责维度循环、执行账、语义收口、判据汇总。它是学习线的核心编排引擎，将里程碑拆解的维度逐个送入执行层，汇总判据后决定闭合状态。

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

### 场景学习 scene_learn.py

`mve/scene_learn.py` 是场景学习入口，含里程碑重试直至成功的逻辑。驾驶舱调度策略：

- 有未完成里程碑 → 选「未闭合维度」
- 全闭合后 → 降级自由出题
- 人在面板问一句 → `set_current_target` 换锚（设计行为，非 bug）

Sources: [README.md:239-280](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L239-L280), [HANDOFF.md:216-281](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L216-L281)

### 驾驶舱 pilot.py

`mve/pilot.py` 是驾驶舱调度入口，支持两种运行模式：

| 模式 | 触发条件 | 行为 |
|---|---|---|
| `once` | 有练习范围 | 范围里最优的一题跑透（判对就停） |
| `loop` | 没有范围 | 出题器连续自适应出题（同构原版 `while True`） |

启动参数：
- `--rounds`：轮次上限（≤0 表示不停）
- `--max-iterations`：最大迭代
- `--topic`：指定题目
- `--help-policy`：求助策略（always/never）

Sources: [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795), [HANDOFF.md:123-155](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L123-L155)

## 学习线五步同构

学习线严格对照原版 Voyager 的五步范式，从 Minecraft JS 代码迁移至 SQL 世界：

| 步骤 | 原版 Voyager | MVE 落地 | 实现文件 |
|---|---|---|---|
| ① 课程初始化 | MC 初始化携带的信息 → 里程碑 | VLML 同构版里程碑 | `voyager_vlml/agents/curriculum.py` |
| ② 控制原语 | control_primitives 的 JS 代码 | SQL 原语 | `voyager_vlml/control_primitives/` |
| ③ 环境安装 | 在 voyager 环境里安装 Mineflayer | VLML MCP 依赖（DB/RIB/VLGG） | `voyager_vlml/env/vlml_mcp.py` |
| ④ 迭代修正 | prompt 里的语言 → JS | prompt 里的语言 → SQL | `voyager_vlml/agents/action.py` + `critic.py` |
| ⑤ 面板后置 | 先验证后端闭环 | 面板（`dashboard.py`） | `mve/dashboard.py` |

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:92-142](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L92-L142)

### 出题器 curriculum.py / question.py

`voyager_vlml/agents/curriculum.py` 对应原版 `curriculum.py` 的 `propose_next_task()`，由 LLM 根据"已完成的任务 + 当前环境状态"生成下一道题。`mve/question_gen.py`（2115 行）是出题器的 MVE 落地，含 QA 攻略层和 `reason_demos` 示范库。

出题器自适应优先级链：错题 → 没做过 → 难度升序，受练习范围收窄。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:92-142](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L92-L142), [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

### 执行层 action.py / local_agent.py

`voyager_vlml/agents/action.py` 对应原版 ActionAgent，将自然语言规划转化为 SQL 执行。`mve/local_agent.py`（1707 行）是本机执行域，支持 `run_saved_async` 重放 Python 程序和证据渲染。

关键设计：原版 `render_system_message()` 把 control_primitives 的**源码**拼进 system message——模型看得到实现，不只是函数名。MVE 通过知识图谱实现等价物传入。

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123), [进度对照.md:902-992](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L902-L992)

### 判卷层 critic.py / task_critic.py

`voyager_vlml/agents/critic.py` 对应原版 CriticAgent，`mve/task_critic.py` 实现真空防线 + 知识型/数据型分型判卷。

**核心约束**：学习侧不判分，只有消费侧判分。判分的尺子不能进学习反馈环，否则学会的是"讨好裁判"。学习侧的 critic 只是过程控制信号（驱动闭合计数/技能入库），不作数、不能当能力证据。

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236), [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245)

## 消费线编排

### 消费链路 consume.py

`voyager_vlml/consume.py`（4317 行）是消费线的完整实现，包含 VLML 接驳、SQL 回填、配方判定。消费线的核心流程：

```mermaid
graph TD
    Q[用户提问] --> R[技能检索]
    R --> C1[单配方命中?]
    C1 -->|是| E1[直接执行]
    C1 -->|否| C2[多技能编排]
    C2 --> CS[_compose_sql]
    CS --> G[字面量守卫]
    G --> E2[执行取真数]
    E1 --> N[叙事聚合]
    E2 --> N
    N --> M[掌握度记账]
    M --> TAG[来源标注]
```

多技能整批编排流程：每条配方 → 回填 :slot（值必须逐字来自实查清单）→ 字面量守卫 / fan-out 闸逐条拦 → 逐条执行取真数 → 数据行标「来源技能」→ 叙事层聚合（来源编号逐个披露）→ critic + 裁判独立复核 → 掌握度记账。

Sources: [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245), [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

### 消费侧双入口

消费侧有两条入口，完整度差异显著：

| 入口 | 接了哪几闸 | 缺什么 |
|---|---|---|
| `voyager_vlml/consume.py`（VLML 消费线） | **闸三** `has_real_data`（判有没有取到真数） | `source_binding` / 搬运判据 / `reason_demos` 全 0 |
| `mve/coach.py:528 explain`（面板聊天） | **一闸都没接** | 真空防线 + 来源绑定 + 搬运判据 + 示范召回，全缺 |

`mve/narrator.py` 实现叙事层聚合授权：组成项允许相加并标来源。叙事（给人看的自然语言回答）单独一层产出，且**声明不参与判分**——判分只看：取到真数没有、方法与裁判比对是否同量、字面量是否全部可指认。

## 技能库与检索

### 技能库 skill_store.py

技能库是参数更新的替代物，存储可检索、可组合、可重放的 SQL 配方。对照原版 Voyager 的 Chroma 向量检索：

| 原版 | MVE |
|---|---|
| `program_name` 主键 + Rewriting | `{topic_id}解法`；词面 Jaccard 近似 |
| Chroma 向量检索，键=任务文本 | `skill_store.retrieve(topic, question)`：词面 Jaccard 相似 + topic 预过滤 |
| 同名 Rewriting（`skill.py:74-76`） | `add()` 的 `rewritten` 分支（`DUP_THRESHOLD=0.62`） |

技能库包含 embedding 检索 + 字面量守卫 + 向量隔离落盘。新增字段：`source`（bypass/learn）和 `blueprint`（缺陷→策略→动作）。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1690-1732](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1690-L1732), [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708)

### 技能检索与注入

检索发生在 rollout 之前：`skills = skill_manager.retrieve_skills(query=context)`。检索键是任务文本，没有 topic_id 路由层——原版中技能和里程碑靠**文本**握手，不靠 ID。

跨题检索门槛：
- `CROSS_TOPIC_MIN_SIM=0.12`
- `CROSS_TOPIC_MAX=2`
- 同题 `score=3.0`

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1690-1732](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1690-L1732)

## 知识图谱与求助闭环

### 图谱作为 control_primitives 等价物

知识图谱在编排层中充当原版 `control_primitives` 的等价物传入规划 prompt。A/B 实测证明：

| 条件 | corrode_collapse 首血转换率 | 覆盖率 |
|---|---|---|
| A：无图谱 | 0.0 | 0% wrong |
| B：图谱只作提示 | 25.0 | 20% partial |
| D：图谱 + 结构/参数硬断言 | 25.0 | **100% correct** |

三条教训：
1. 提示打不过强先验，得换成约束
2. 改一处会碰掉另一处（需多条断言同时上）
3. "调对了工具"不等于"取得到值"（需参数断言）

Sources: [进度对照.md:902-992](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L902-L992), [知识图谱与求助闭环.md:409-471](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L409-L471)

### 求助闭环

```mermaid
sequenceDiagram
    participant V as Voyager
    participant G as 知识图谱
    participant H as 求助判定
    participant VLML0 as VLML0解释
    participant M as 掌握度

    V->>+G: 判错，查缺失工具
    G-->>V: 缺失维度+应调工具
    V->>+H: decide_help()
    alt 有点名但没试过的工具
        H-->>V: 不求助，先自己试
    else 全试过仍失败
        H->>+VLML0: 求助，跑解释
        VLML0-->>-H: 只带回做法(不给数值)
        H-->>V: 带解释重做
        V->>V: 重试本题
        V->>+M: 重算掌握度
        M-->>-V: hint_used_modifier=0.85
    end
```

掌握度重算规则：借助帮助答对 → 得分打 0.85 折，半衰期不动（打折但不加速遗忘）。

Sources: [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708), [知识图谱与求助闭环.md:409-471](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L409-L471)

## 练习范围与场景管理

### 练习范围 practice_scope.py

`mve/practice_scope.py` 管理练习范围，范围落 `practice_scope.json`：

- canonical 校验：维度必须在当前图谱里，否则 `PRACTICE_SCOPE_INVALIDATED`
- `scope_revision` 递增
- 读时重新校验，失效返回 `invalidated + 原因`

范围→题的映射：图谱只负责**校验维度存在**，topic 列表从 `tasks` 的 rubric 对账。驾驶舱删掉 `runMode`/`runRounds`/`runTopic`，只剩开始/停止。

Sources: [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

### 1→n 可插拔场景

插入新场景 = 面板「＋ 新建场景」（注册命名空间 + 校验可执行动作），不重启、不清库。

| 场景 | 数据源 | 状态 |
|---|---|---|
| A · Valorant | rib.gg（21 原生表 + 4 ext 表） | 首个场景，掌握账 360+ 节点 |
| B · 合成薪酬库 | payroll.duckdb | 清零重学验收通过 |
| C · 纽约市真实薪酬 | NYC OpenData FY2025 | 已接，真库学习待跑 |
| H · GitHub 仓库调研 | `gh_*` 四件套 + 本机 duckdb | 运行中 |

## 旁路学习与反馈链路

### bypass_learn.py

旁路学习跑 `vlml0_referee.answer` 拿标准轨迹 → 过滤内部标记 → LLM 提炼 `{name, lesson, defect, strategy}` → 写技能库（`source="bypass"`）。

缺陷四类：`missing_dimension` / `wrong_granularity` / `tool_uncovered` / `value_form`
策略四类：`drill_down` / `switch_tool` / `combine_tools` / `read_scope`

关键教训：给"做法描述"没用，给"编排序列"才有用。补上 `_blueprint_hint` 后轨迹从 1 步变 2 步——行为真的改了。

Sources: [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708)

### 反馈链路诊断

`learn()` 里两处产出都是硬编码模板（判对/判错），每轮只换维度名。死结：判错不写技能库（正确）→ 学习只可能发生在判对时 → 判对时写的又是模板 → 技能库长期 1 条。旁路学习是打破此死结的机制。

Sources: [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708)

## 总结

后端服务与编排层是 MVE 框架的运行核心，以两条管线（学习线/消费线）和两层调度（整题层/子目标层）为骨架，严格同构原版 Voyager 的范式并迁移至真实数据库环境。技能库替代参数更新、判官+确定性守卫替代奖励信号、知识图谱作为 control_primitives 等价物传入规划——这三条设计决策构成了编排层的核心差异点。1→n 可插拔场景机制使得同一学习引擎能在新领域从零开课，而旁路学习与求助闭环则打破了反馈链路的死结，使技能习得真正发生。

# LLM 集成与 VLML 桥接

MVE 系统的 LLM 集成与 VLML 桥接层是整个框架的神经中枢：它向下对接 VLML 的 10 个 MCP 工具与多源数据库（vlr.gg / rib / GRID），向上为主循环的出题、执行、判官三阶段提供统一的模型调用接口。该层的设计核心是**模型可替换性**——换掉外接 LLM（flash ↔ glm-4.6）闭环照跑，MVE 因此能充当「任意小模型的学习能力测试台」。判官（critic）是另一个独立配置的 LLM + 确定性闸门，不是神经 reward model，与主模型解耦以确保学习信号不被污染。

Sources: [HANDOFF.md:49-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L66), [README.md:1-69](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L69)

```mermaid
graph TD
    A[主循环 voyager.py] --> B[LLM Client]
    A --> C[VLML Env]
    B --> D[主模型 glm-4.6]
    B --> E[判官模型 CRITIC]
    C --> F[VLML MCP Bridge]
    C --> G[VLML HTTP Bridge]
    F --> H[10 MCP 工具]
    G --> H
    H --> I[query_sql]
    H --> J[报告工具]
    H --> K[模式检测]
    I --> L[DuckDB 多源]
    L --> M[vlr.gg]
    L --> N[rib]
    L --> O[GRID]
    P[VLML Schema] --> Q[information_schema]
    P --> R[建模文档解析]
    R --> S[DATA_MODEL.md]
    R --> T[DATA_DICTIONARY.json]
    R --> U[column_definitions.yaml]
    R --> V[DERIVED_TABLES.md]
```

上图展示了从主循环到 LLM 和 VLML 的两条核心通路。主循环通过 `llm_client.py` 调用主模型与判官模型，通过 `vlml_env.py` 经 MCP/HTTP 桥接访问 VLML 工具集，最终抵达多源 DuckDB 数据库。`vlml_schema.py` 独立完成 schema 发现与建模文档解析。

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123), [mve/vlml_schema.py:428-481](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/vlml_schema.py#L428-L481)

## LLM Client 架构

### 模型配置机制

LLM Client 采用环境变量 + `setdefault` 的两层配置策略：

| 配置项 | 环境变量 | 默认值 | 说明 |
|---|---|---|---|
| 主模型 | `ZHIPU_MODEL` | `glm-4.6` | `llm_client.py:34` 用 `setdefault` 读取 |
| 判官模型 | `MVE_CRITIC_MODEL` | `glm-4.6` | systemd `Environment=` 单独设置 |
| API 密钥 | `ZHIPU_API_KEY` | — | `.env` 文件，权限 600 |
| Base URL | `ZHIPU_BASE_URL` | — | 智谱 API 端点 |

**2026-10-31 起全局切换至 glm-4.6**（原 flash），原因：flash 拿着「出错行号 + 返回形状」仍然 4 步重犯 `KeyError: 0`、里程碑点不亮；换 4.6 后 KeyError 0 次、里程碑**首次点亮**、`status=learned` 11 次。这是「模型能力差异被框架如实反映」的直接证据。

Sources: [HANDOFF.md:87-95](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L87-L95)

### chat_json 接口与推理模型适配

`chat_json` 是 LLM Client 的核心调用方法，返回结构化 JSON。glm-4.6 作为推理模型存在 `content` / `reasoning_content` 分离的口径问题——天授诊断复跑时报「返回空内容」即因此所致。调用时需检查取值口径，确保从正确的字段提取响应内容。

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236)

### 判官模型与主模型解耦

```mermaid
sequenceDiagram
    participant Loop as 主循环
    participant Main as 主模型
    participant Critic as 判官模型
    participant Gate as 确定性闸门

    Loop->>+Main: 规划/出题/执行
    Main-->>-Loop: 动作序列
    Loop->>+Gate: 确定性规则先判
    alt 确定性可判
        Gate-->>-Loop: verdict(布尔)
    else 需 LLM 判
        Gate->>+Critic: 语义判定
        Critic-->>-Loop: verdict + quotes
    end
```

判官模型与主模型**必须解耦**，理由：判分的尺子不能进学习反馈环，否则它学会的是「讨好裁判」。学习侧的 critic 只是过程控制信号（驱动闭合计数/技能入库），**不作数、不能当能力证据**。只有消费侧判分才是一把真正的尺子。

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236), [docs/README-学习机制详解-2026-10-13-存档.md:728-834](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L728-L834)

### 原版 Voyager 模型调用对照

原版 Voyager 的模型调用集中在 `neko_model.py`，通过 `render_system_message()` 把 `control_primitives` 的**源码**拼进 system message——模型看得到实现，不只是函数名。MVE 之前两样都缺：图谱里没有指标语义，而且**压根没进 prompt**（只喂了面板可视化、取证 hint、判错反馈）。这一差距是知识图谱作为 `control_primitives` 等价物的设计动机。

Sources: [voyager_original/voyager/neko_model.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/neko_model.py), [进度对照.md:902-992](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L902-L992)

## VLML 环境桥接

### MCP 工具目录

`mve/vlml_env.py` 直连 VLML 的 10 个 MCP 工具，`TOOL_CATALOG` 照搬 `server.py` docstring。工具按功能分为三类：

| 类别 | 工具 | 产出 |
|---|---|---|
| 查询类 | `query_sql` | 任意 SQL 的结果集 |
| 报告类 | `match_summary_report` / `player_profile_report` / `team_performance_report` 等 | 结构化报告（含 section 洞察） |
| 检测类 | `pattern_detection_report` | 模式识别结果（eco_win_rate / pistol_win_rate / pattern_rounds 等） |

Sources: [HANDOFF.md:49-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L66), [mve/vlml_env.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/vlml_env.py)

### VLML 环境执行流程

```mermaid
sequenceDiagram
    participant Agent as ActionAgent
    participant Env as vlml_env
    participant MCP as VLML MCP
    participant DB as DuckDB

    Agent->>+Env: 调用工具(tool_name, args)
    Env->>Env: 校验工具在 TOOL_CATALOG
    Env->>+MCP: MCP call_tool(name, args)
    MCP->>+DB: 执行 SQL / 聚合
    DB-->>-MCP: 原始结果
    MCP-->>-Env: 结构化响应
    Env->>Env: 渲染观察(observation)
    Env-->>-Agent: observation + events
```

### cwd 路径陷阱

`vlml_env` 里 `os.chdir(vlml/)`（VLML 查询依赖那个 cwd），配置写相对路径 `vlml/data/x.duckdb` 时 DuckDB 按 cwd 拼 → `<repo>/vlml/vlml/data/x.duckdb`，**vlml 出现两遍**。修复方案：四个读取口（`vlml_env` / `anchor` / `entity_catalog` / `db_switch`）统一按**仓库根**解析；`db_switch.write()` 存绝对路径；启动时校验文件存在并告警。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796)

`vlml_bridge/` 提供两种桥接方式：

| 桥接方式 | 文件 | 适用场景 |
|---|---|---|
| HTTP Bridge | `vlml_http_bridge.py` | 远程 VLML 服务，REST API 调用 |
| MCP Bridge | `vlml_mcp.py` | 本地/同进程 MCP 协议，低延迟 |

## VLML Schema 与数据建模

### 四层发现架构

`mve/vlml_schema.py` 实现**实查数据库 + 解析源码**的双通道发现，得到「库里现在有什么」和「作者声明它应该是什么」的完整图景：

```mermaid
graph TD
    A[vlml_schema.discover] --> B[实查 information_schema]
    A --> C[解析源码]
    B --> D[表清单/列名/行数]
    C --> E[transformations 派生关系]
    C --> F[tools/sql 洞察]
    C --> G[reports return 段]
    A --> H[建模文档解析]
    H --> I[DATA_MODEL.md]
    H --> J[DERIVED_TABLES.md]
    H --> K[column_definitions.yaml]
    H --> L[DATA_DICTIONARY.json]
    D --> M[表节点 21 张]
    E --> N[派生血缘边]
    F --> O[洞察节点 46 个]
    I --> P[Grain + Use cases]
    J --> Q[派生表粒度/上游]
    K --> R[列级口径 141 行]
    L --> S[pk/列类型/指标公式]
```

Sources: [mve/vlml_schema.py:428-481](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/vlml_schema.py#L428-L481), [知识图谱与求助闭环.md:409-471](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L409-L471)

### 建模文档四件套

伴学的 457 个知识点每个自带 19 个字段（难度、题型、先修、典型错法…），出题器读节点声明定题型与口径，模型只写题面。VLML 里同层的「作者声明」就在 `database/` 下四份建模文档：

| 文档 | 提供什么 | 解析方法 |
|---|---|---|
| `DATA_MODEL.md` | 每张表的 `Grain` + `Use cases`；主干血缘 | `_parse_core_lineage()` 正则提取 Core Relationships |
| `DERIVED_TABLES.md` | 7 张派生表的粒度 / 上游 / 关键列 / 示例查询 | 结构化段落解析 |
| `metadata/column_definitions.yaml` | 列级口径（141 行手写） | YAML 加载 |
| `DATA_DICTIONARY.json` | 主键 / 列类型 / flag / **指标公式** | JSON 加载 |

**关键**：两个来源都要扫。只扫数据字典会漏 `agg_first_blood_stats`（不在字典里），而 fb_conversion_analysis 的四个评分点全读它——只扫字典时 `derived_from` 边全丢，图谱只剩 1 张表。

Sources: [mve/vlml_schema.py:428-481](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/vlml_schema.py#L428-L481), [知识图谱与求助闭环.md:272-368](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L272-L368)

### 派生血缘链

解析 `database/transformations/*.sql` 得到的完整派生血缘（自环已剔除）：

```
base_events ─┬→ agg_player_round_stats ─┬→ agg_player_game_stats ─→ agg_player_series_stats ─→ agg_tournament_stats
             │                          ├→ agg_team_round_summary / agg_team_game_stats → agg_team_map_stats
             │                          └→ agg_player_win_shares（还读 ref_win_probability_factors）
             ├→ agg_team_round_stats ───→ agg_team_game_stats
             └→ agg_first_blood_stats / agg_post_plant_stats
```

Sources: [知识图谱与求助闭环.md:409-471](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L409-L471)

### Schema 三要素

实测证明只给列名不够，模型会把 `fb_player` 写成 `player_name`，critique 每轮列真名它照样编。Schema 必须包含三要素：

| 要素 | 作用 | 来源 |
|---|---|---|
| 每张表行数 | 空表排后面防截断 | `information_schema` 实查 |
| 列类型 | 防布尔列当字符串比 | `column_definitions.yaml` + 实查 |
| 一行真实样例 | 给值域直觉 | `SELECT * FROM t LIMIT 1` |

空表明写「查它只会得 0 行」，否则模型会挑名字更「正规」的空表（如 `agg_*`）而忽略有数据的 `ext_*` 表。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796)

## 判官 Prompt 体系

### 原版与 MVE 判官对照

| 方面 | 原版 Voyager | MVE |
|---|---|---|
| Prompt 来源 | `voyager_original/voyager/prompts/critic.txt` | `voyager_vlml/prompts/critic.txt` |
| 判定方式 | 环境事件 + self-verification | 真实取到数 + critic + 三道确定性守卫 |
| 经验结晶 | JS 技能库（Chroma 向量检索） | SQL 配方库（embedding 检索 + 字面量守卫） |
| 成功定义 | `critic.check_task_success` 布尔 | `ev.success` + 判词 + 覆盖率 |

Sources: [voyager_original/voyager/prompts/critic.txt](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/prompts/critic.txt), [voyager_vlml/prompts/critic.txt](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_vlml/prompts/critic.txt)

### 确定性闸门优先

判官采用**确定性层先跑、判不了回退 LLM** 的策略：

```mermaid
graph TD
    A[执行结果] --> B{确定性规则可判?}
    B -->|是| C[布尔 verdict]
    B -->|否| D[LLM 判官]
    D --> E[verdict + quotes + gap]
    C --> F[技能入库判定]
    E --> F
```

`answer_spec` SQL 直算 → 缺口才 LLM 编排。`expected` / `tolerance` 只从服务端私有 `answer_spec` 读，**绝不用模型生成的参考答案替换服务端答案**。

Sources: [进度对照.md:1-54](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L1-L54), [docs/README-学习机制详解-2026-10-13-存档.md:728-834](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L728-L834)

### 消费侧两条入口的判据差异

| 入口 | 接了哪几闸 | 缺什么 |
|---|---|---|
| `voyager_vlml/consume.py`（VLML 消费线） | **闸三** `has_real_data` | `source_binding` / 搬运判据 / `reason_demos` 全 0 |
| `mve/coach.py:528 explain`（面板聊天） | **一闸都没接** | 真空防线 + 来源绑定 + 搬运判据 + 示范召回，全缺 |

修的方向是把这两条入口补齐（先 coach.explain 的真空防线），**绝不是**让两侧判据一致——那会破坏「尺子不进反馈环」的设计。

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236)

## 知识图谱与 LLM Prompt 集成

### 图谱作为 control_primitives 等价物

原版 Voyager 凭 `render_system_message()` 把 `control_primitives` 的**源码**拼进 system message。MVE 的同构实现是将知识图谱渲染进规划 prompt，使模型获得：

1. **指标语义**：`列的含义：fb_team_won=Conversion flag (1/0)`
2. **脱敏骨架**：`WHERE series_id='?' AND map_name='?'`（给口径、给结构，不给答案）
3. **典型错法**：按致命程度排序的 `typical_errors`
4. **单位声明**：`unit: %` → prompt 里明写「百分数，不是小数」

Sources: [知识图谱与求助闭环.md:272-368](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L272-L368), [进度对照.md:902-992](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L902-L992)

### A/B 实测证据

同一道题（corrode_collapse，难度 4），只改图谱这一个变量：

| 组 | 配置 | 首血转换率 | 覆盖率 |
|---|---|---|---|
| A | 无图谱 | 0.0 | 0% wrong |
| B | 图谱只作提示 | 25.0 | 20% partial |
| D | 图谱 + 结构/参数硬断言 | 25.0 | **100% correct** |

**关键教训**：提示打不过强先验，得换成约束。B 组把完整骨架写进 prompt，模型五次实跑一字不改；加 SQL 结构断言后一次就改对了。

Sources: [进度对照.md:902-992](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L902-L992), [知识图谱与求助闭环.md:409-471](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L409-L471)

### 图谱注入与求助的分工

图谱是**常驻**上下文，像 `control_primitives` 一样一直在 prompt 里，**不计入 `used_hint`、不打掌握度折扣**；求助（VLML0 解释）才是伴学意义上的「借助帮助」，要打 0.85 折。两者在 prompt 中的角色：

```mermaid
graph TD
    A[规划 Prompt] --> B[知识图谱<br/>常驻/不打折]
    A --> C[技能库检索<br/>常驻/不打折]
    A --> D[判错反馈<br/>本轮/不打折]
    A --> E[求助解释<br/>临时/打 0.85 折]
    B --> F[指标语义+骨架+错法]
    C --> G[可复用 SQL 配方]
    D --> H[缺哪些/没覆盖/为什么错]
    E --> I[做法序列/不给数值]
```

Sources: [知识图谱与求助闭环.md:1-156](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L1-L156), [知识图谱与求助闭环.md:272-368](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L272-L368)

---

LLM 集成与 VLML 桥接层是 MVE 框架实现「模型可替换性」和「数据可插拔性」的关键基础设施。主模型与判官模型的解耦确保学习信号不被污染；VLML 的 MCP/HTTP 双桥接提供了统一的工具访问接口；Schema 四件套的实查+声明双通道发现使知识图谱能承担 `control_primitives` 等价物的角色；三源数据集成（vlr/rib/GRID）通过 `ingest.py` 统一摄入，公开源的 `agg_*` 缺失以诚实标注而非硬造的方式暴露。整个设计遵循「尺子不进反馈环」的核心纪律，所有配置通过环境变量注入，无硬编码凭据。

# 部署与运维

MVE（Voyager-VLML 最小可执行原型）的部署架构围绕**本地开发 + 腾讯云服务器 + Caddy 网关 + systemd 常驻服务**四层构建。运维核心是：代码改动必须重启面板（Python 模块启动时 import 缓存）、预览路由不污染主面板、场景数据按场景隔离可插拔。本文覆盖从冷启动到日常运维的完整链路，包括环境依赖、部署三步曲、面板服务管理、场景数据管理、常见故障排查与稳定性修复记录。

Sources: [HANDOFF.md:1-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L1-L66), [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245), [环境体检.md:1-100](https://github.com/Zxy876/voyager-vlml-mve/blob/main/环境体检.md#L1-L100)

## 部署三步曲

每次改完代码后的标准部署流程：

```mermaid
sequenceDiagram
    participant Dev as 本地开发机
    participant GH as GitHub
    participant Srv as 腾讯云服务器
    participant Sys as systemd

    Dev->>+GH: git push origin main:main main:feature/1-to-n-pluggable-scenes
    GH-->>-Dev: push 输出（不可信）
    Dev->>+GH: git ls-remote origin main feature/1-to-n-pluggable-scenes
    GH-->>-Dev: 核实 sha（必做）
    Dev->>+Srv: ssh root@43.161.203.50
    Srv->>Srv: cd /root/mve && git fetch
    Srv->>Srv: git reset --hard origin/feature/1-to-n-pluggable-scenes
    Srv->>+Sys: systemctl restart mve-panel
    Sys-->>-Srv: 重启完成
    Srv-->>-Dev: 部署成功
```

### 第一步：本地提交

```bash
git push origin main:main main:feature/1-to-n-pluggable-scenes
git ls-remote origin main feature/1-to-n-pluggable-scenes   # 必须核实 sha，别信 push 输出
```

服务器跟的是 `feature/1-to-n-pluggable-scenes` 分支，**main 和 feature 两个分支都要推**。

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123), [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245)

### 第二步：服务器同步

```bash
ssh -i ~/.ssh/mve_agent root@43.161.203.50
cd /root/mve && git fetch && git reset --hard origin/feature/1-to-n-pluggable-scenes
```

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

### 第三步：重启（必做）

```bash
systemctl restart mve-panel
```

**重启前必查**：`pgrep -af 'scene_learn|pilot'`。有活循环先 `curl -X POST http://172.18.0.1:8777/mve/api/pilot/stop`。

> 面板是 systemd 常驻服务，Python 模块在**启动时 import 一次就缓存了**。只 pull 不重启，面板跑的还是旧代码。

重启会杀子进程，但 `pilot_state.json` 仍写着 running —— 这是**陈旧状态**，不是 bug，别去修那个文件。

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123), [docs/README-学习机制详解-2026-10-13-存档.md:1505-1577](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1505-L1577)

## 面板服务管理

### 面板架构

面板（`mve/dashboard.py`，4196 行）是单文件 HTTP 服务，提供 `/mve/` 唯一入口，**不建第二面板**。数据聚合层在 `mve/panel_data.py`（1169 行），`build_state` 按 `scene.id` 过滤。

面板分区包括：驾驶舱、知识图谱、技能库、掌握度、消费问答、裁判比对、行动因果时间线、场景管理、清库。

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123), [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245)

### 预览路由原则

改动推上服务器时，在腾讯云多开一个路由（如 `/mve-preview/`，仿照 `/mve*` 的 Caddy handle 块）存放/预览改动效果：

> **绝对不可以污染主面板 `/mve/`**

Sources: [HANDOFF.md:216-281](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L216-L281)

### API 端点

| 端点 | 用途 |
|---|---|
| `/mve/api/overview` | 面板总览数据 |
| `/mve/api/pilot/stop` | 停止学习循环 |
| `/mve/api/state` | 面板状态（含 `practice_scope`） |

**注意**：容器内服务只认 `http://172.18.0.1:8777`（docker 网桥），`127.0.0.1` 不通。

Sources: [HANDOFF.md:1-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L1-L66), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

## 环境坑与避坑指南

以下是实测踩过的环境陷阱：

| 坑 | 现象 | 解决方案 |
|---|---|---|
| 服务器无 pytest | `pytest` 命令不存在 | 只用 `python mve/test_xxx.py` |
| 本地无 duckdb | 数据类测试失败 | 数据类测试必须服务器跑 |
| worktree 陷阱 | worktree 目录没有 `mve/.env` → `chat_json` 全失败 | 用 worktree 前先 `cp mve/.env` |
| 探测地址 | `127.0.0.1` 不通 | 必须走 `http://172.18.0.1:8777`（docker 网桥） |
| commit 中文 | `-m` 引号转义问题 | 用 `git commit -F 文件` |
| Caddy 覆盖 | 重跑脚本覆盖 Caddyfile | 改 Caddyfile 必须同步改脚本模板 |
| VLML 数据空 | GRID API key 缺失 | 用合成数据方案 B 先跑通链路 |

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123), [环境体检.md:1-100](https://github.com/Zxy876/voyager-vlml-mve/blob/main/环境体检.md#L1-L100)

`git worktree add` 出来的目录**没有 `mve/.env`** → `chat_json` 全失败 → `generalize` 静默原样返回 → 测试「碰巧过」。用 worktree 对账前必须先拷贝 env 文件。

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

## 稳定性修复记录

### 技能重放事件循环丢失

- **症状**：`RuntimeError: 已学技能 style 重放失败：NameError: name 'mcp_neko_web_search' is not defined`
- **根因**：外层 `solve` 在事件循环线程建命名空间 → mcp_* 注入成功；但技能函数在 worker 线程里重建命名空间，`_ns_base` 不传 loop 时 `get_running_loop()` 抛错被吞
- **修**：solve 捕获 `get_running_loop()`，经 `_build_skill_fns → _make_skill_fn → _ns_base(loop=…)` 一路下传

Sources: [docs/泛化改造与测试证据-2026-10-21.md:1-85](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/泛化改造与测试证据-2026-10-21.md#L1-L85)

### 消费侧超时

- **症状**：5 条技能全部进了 trace，但 `errors: ["执行超时（>30s）"]`、rows 0
- **根因**：consume 调 `_la.solve()` 没传 timeout；5 条串行 40~100s
- **修**：`_consume_timeout(n_skills)` = 30 + 25×条数，封顶 180s，`MVE_CONSUME_TIMEOUT` 可覆盖

Sources: [docs/泛化改造与测试证据-2026-10-21.md:1-85](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/泛化改造与测试证据-2026-10-21.md#L1-L85)

### MCP 网关连接绑死旧循环

- **症状**：重启面板后第一次导入能通、之后全部超时
- **根因**：stdio MCP 的 transport 绑在连接时的那个循环上；面板每次导入 `asyncio.run()` 起新循环，网关却是进程级单例
- **修**：`MCPClient.loop` 记录连接时循环；`connected_servers(loop)` 只算绑当前循环的连接；`stale_servers(loop)` + `ensure_mcp_tools` 发现死连接就 `disconnect_all()` 整批重连

Sources: [docs/泛化改造与测试证据-2026-10-21.md:1-85](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/泛化改造与测试证据-2026-10-21.md#L1-L85)

### 调试取证方法

下次排查照抄：
1. 看 `/proc/<pid>/fd` 是否指向 `(deleted)`/旧循环
2. 看 `coach_log` `errors` 里的超时条数
3. 对比「是否只有第一次成功」

Sources: [docs/泛化改造与测试证据-2026-10-21.md:1-85](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/泛化改造与测试证据-2026-10-21.md#L1-L85)

## 天授诊断工具

`mve/env_adapter.py`（221 行）+ `mve/tianshou_diagnose.py` 是一套**排除法诊断工具**——把 gymnasium env 包成「代码即动作」，reward/terminated 直接透传 env，用来回答「MVE 循环本身对不对」。

```mermaid
flowchart TD
    A["机制正常？"] -->|是| B["根因在判官"]
    A -->|否| C["先修机制"]
    C --> D["别急着归因幻觉"]
    B --> E["修判官"]
```

**按设计就不接进主循环**，不是漏了接线。

### 复跑注意

1. 开关是**命令行参数**不是环境变量：`python mve/tianshou_diagnose.py MOCK`（用 `MOCK=1` 会走真 LLM 路径）
2. 复跑真 LLM 版报「返回空内容」——疑似 glm-4.6 推理模型的 `content` / `reasoning_content` 分离所致
3. 需要 `pip install gymnasium`

# 扩展与定制：新场景接入指南

MVE 项目采用 **1→n 可插拔场景**架构，核心学习闭环（拆维度 → 取证 → 判官把关 → 技能入库 → 复用）与具体数据源解耦。插入新场景无需修改学习引擎代码，只需注册命名空间、校验可执行动作，即可在不重启、不清库的条件下让 Voyager 在新数据域上自主学习和消费。本指南详述新场景从零接入的完整流程、关键数据结构、知识图谱冷启动机制，以及消费侧复用链路的对接方式。

Sources: [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245), [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

## 架构总览：场景与学习闭环的关系

MVE 的场景是数据域的隔离单元，每个场景拥有独立的技能库、课程账、里程碑、掌握度账本和知识图谱。学习引擎对所有场景透明——它只读 `scene.id` 过滤后的数据，不感知场景切换。

    A[新场景注册] --> B[命名空间隔离]

    G --> H[技能入库]

## 场景注册与命名空间

### 场景身份与隔离

每个场景由 `scene.id`（单字母如 A/B/C/H）唯一标识。面板数据聚合层 `panel_data.py` 的 `build_state` 按 `scene.id` 过滤，确保不同场景的技能库、课程账、里程碑互不干扰。

| 属性 | 说明 | 来源 |
|---|---|---|
| `scene.id` | 场景唯一标识（A/B/C/H） | `panel_data.py:build_state` |
| 命名空间 | 技能库、图谱节点按场景隔离 | `skill_store.py` |
| 数据源 | DuckDB 文件路径（`vlml_rib.duckdb` / `payroll.duckdb`） | `db_config.json` |
| `scene_profile` | 四种 kind：`vlml / scene / local / missing` | `scene_context.py` |

## 数据源接入

### DuckDB 文件与路径解析

MVE 使用 DuckDB 作为场景数据引擎。数据源路径解析必须统一按**仓库根**解析，避免 `os.chdir` 导致的路径拼接错误。

```mermaid
sequenceDiagram
    participant User as 用户
    participant Panel as 面板
    participant DBSwitch as db_switch
    participant DuckDB as DuckDB
    participant VLMLEnv as vlml_env

    User->>Panel: 选择新数据源
    Panel->>DBSwitch: write(db_path)
    DBSwitch->>DBSwitch: 存绝对路径
    DBSwitch->>DuckDB: 校验文件存在
    DuckDB-->>DBSwitch: 存在/不存在
    DBSwitch-->>Panel: 告警/确认
    Panel->>VLMLEnv: 重启后打补丁换默认库
    VLMLEnv->>DuckDB: EventDatabase(read_only=True)
```

关键规则：
- 四个读取口（`vlml_env` / `anchor` / `entity_catalog` / `db_switch`）统一按仓库根解析
- `db_switch.write()` 存绝对路径
- 启动时校验文件存在并告警
- **换库后必须重启面板进程**才生效（VLML 工具里写死 `EventDatabase(read_only=True)`，补丁只在进程启动时装一次）

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796), [mve/dashboard.py:1628-1697](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/dashboard.py#L1628-L1697)

### 公开源与派生层限制

公开数据源（rib / vlr）的 9 张 `agg_*` 派生表均为 0 行，但原料在 `ext_*` 表里。这是产品级限制，不是 bug：

| 限制项 | 说明 |
|---|---|
| `agg_*` 派生层为空 | 9 张派生表在公开源都是 0 行 |
| `player_profile_report` 必然失败 | VLML 写死查 `agg_player_game_stats`（公开源 0 行） |
| 种子题实体写死 | 6 道任务 SQL 写死了 GRID 图名/队名，rib 库里不存在这些实体 |

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236), [docs/README-学习机制详解-2026-10-13-存档.md:1505-1577](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1505-L1577)

## 场景上下文与渐进披露

### 渐进披露模型

`scene_context.py` 实现了 MVE 等价的「渐进披露初始场景注入」，将 Minecraft 的 `warm_up` 机制翻译为数据域的分层控制：

```mermaid
graph TD
    A[biome 世界] --> B[数据源身份]
    C[nearby_blocks 眼前] --> D[当前可见表 + VLML 10 工具]
    E[inventory 背包] --> F[实体可填值 + 已掌握知识点]
    G[chests 箱内存货] --> H[技能库图谱]
    B --> I[场景注入 prompt]
    D --> I
    F --> I
    H --> I
```

| MC 元素 | MVE 等价物 | 来源 |
|---|---|---|
| biome（世界） | 数据源身份（vlml_vlr / vlml_rib / 默认库） | `db_config` |
| nearby_blocks（眼前） | 当前可见的表 + VLML 10 工具（base 层恒给，ext_* 层进度够了才给） | `information_schema` |
| inventory（背包） | 实体可填值（锚点 series/team/map + 目录可选项）+ 已掌握知识点 | `anchor / entity_catalog / 掌握度` |
| chests（箱内存货） | 技能库图谱（已学会的技能/配方） | `skill_store / 掌握度` |

Sources: [mve/scene_context.py:1-60](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_context.py#L1-L60)

### 进度档位

```python
TIER_BASE = 0   # 新手：只看 base 表
TIER_EXT = 1    # 已解锁基础层：放开 ext 表
```

升到 ext 档需要已解锁若干里程碑。用**里程碑数**而不是掌握度，因为掌握度是软尺子不能进反馈环。场景层渐进披露与支架层（full/partial/none）正交——新手可能场景全开但支架全给，老手可能场景只给 base 表但支架全撤。

Sources: [mve/scene_context.py:1-60](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_context.py#L1-L60), [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236)

### VLML 语义工具集

VLML 10 工具是跨域基线，换库只是"该层题有没有数据"，工具集恒定，技能可迁移：

```python
SEMANTIC_TOOLS = [
    "match_analysis_report", "match_summary_report", "match_players_report",
    "match_rounds_report", "match_economy_report", "player_profile_report",
    "scouting_report", "pattern_detection_report",
    "query_sql", "get_database_info",
]
```

Sources: [mve/scene_context.py:1-60](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_context.py#L1-L60)

## 知识图谱冷启动

### 图谱的三层节点与五类边

新场景接入后，知识图谱从冷启动（只有场景根节点）开始，随学习推进逐步构建：

```mermaid
graph TD
    T[table:rounds] -->|derived_from| D1[dim:map_rounds]
    Tool1[tool:pattern_detection_report] -->|produced_by| D2[dim:eco_win_rate]
    D3[dim:pistol_win_rate] -->|confusable| D2
    D3 -->|co_occurs| D1
    Tool2[tool:match_summary_report] -->|procedure_step| Tool1
```

| 节点层 | 说明 | 伴学对照 |
|---|---|---|
| 表（table） | VLML 数据建模表，带真实列名 + grain | — |
| 工具（tool） | VLML 语义工具 | — |
| 维度（dimension） | 评分点/指标，带 semantics / recipe / typical_errors | 知识点（带 `typical_misconceptions`） |

| 边类型 | 含义 | 来源 |
|---|---|---|
| `produced_by` | 维度由哪个工具产出 | `RubricPoint.answer_spec.tool` |
| `derived_from` | 维度/工具从哪张表派生 | 解析 `answer_spec.sql` 里的表名 |
| `confusable` | 易混淆的维度对 | 同题"同后缀不同前缀"的维度 |
| `co_occurs` | 同题共现的维度 | 实测 |
| `procedure_step` | 工具编排顺序 | 裁判实测的编排顺序 |

Sources: [知识图谱与求助闭环.md:1-156](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L1-L156), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

### 冷启动与面板渲染

场景图谱为空（只有场景根节点）是冷启动的**正常态**。面板渲染逻辑：

- 孤立维度（kind=dimension，没被任何种子题的 rubric 连到工具/表）**必画**——它是"问题插进场景"的可见证明
- 工具/表只有连边才画（避免 machinery 把图变乱）
- `deleted` 节点不画
- 冷启动期显示引导文案："去「人导入」问一个属于这个场景的问题"

Sources: [mve/dashboard.py:1628-1697](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/dashboard.py#L1628-L1697)

### 图谱做细：照伴学 `typical_misconceptions`

图谱节点的同构字段：

| 字段 | 说明 | 泄题边界 |
|---|---|---|
| `semantics` | 指标怎么算（如 `ROUND(AVG(fb_team_won)*100, 1)`） | 给口径不给答案 |
| `recipe` | 复杂指标的脱敏骨架（gaps-and-islands） | SQL 字符串字面量一律抹成 `'?'` |
| `columns_by_table` | 每张表实际用到哪些列 | 按表分开存，避免同名列张冠李戴 |
| `value_columns` | 取结果的第几列 | — |
| `typical_errors` | 典型错法（按致命程度排序） | — |

Sources: [知识图谱与求助闭环.md:185-298](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L185-L298), [mve/voyager.py:758-828](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/voyager.py#L758-L828)

### 两层调度

新场景接入后，学习引擎按两层调度运行：

```mermaid
graph TD
    A[整题层 learn] --> B{任务成功?}
    B -->|成功| C[技能入库]
    B -->|失败| D[挂冷却 + 降级自由出题]
    C --> E[里程碑点亮]
    E --> F[子目标层 inference]
    F --> G{维度闭合?}
    G -->|是| H[下一维度]
    G -->|否| I[重试最多4次]
    I --> J{达到上限?}
    J -->|是| K[记 failed + 换题]
    J -->|否| F
    H --> L{全闭合?}
    L -->|是| M[generalize 去数值]
    M --> N[技能入库]
```

**三个铁律**：

1. 原版没有「整题总验收」层——`inference()` 的完成判据只是「最后一条子目标成功」
2. 原版对做不出的任务从不原地无限重试——单任务封顶 `action_agent_task_max_retries=4`
3. 骨架拆一次就固定，永不因失败重拆

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

### 技能合成与回注

新场景的技能入库遵循原版 Voyager 的同构实现：

| 机制 | 原版 | MVE 落地 |
|---|---|---|
| 技能形态 | JS 源码（`programs` property） | SQL 配方（`code` 字段） |
| 检索键 | 任务文本 | `topic_id` 预过滤 + 词面 Jaccard 相似 |
| 同名处理 | Rewriting（先 delete 再 add） | `DUP_THRESHOLD=0.62`，相似度 ≥0.62 → 覆盖 |
| 防膨胀 | `dict[program_name]`，同名覆盖 | `skill_store.add()` → `added / rewritten / skipped` |
| 检索上限 | `k=min(count, retrieval_top_k)` = 5 | `skill_store.retrieve(top_k=5)` |

Sources: [docs/泛化改造与测试证据-2026-10-21.md:1-85](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/泛化改造与测试证据-2026-10-21.md#L1-L85), [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

### 蓝图提示注入

技能注入时带出标准编排序列（`_blueprint_hint`），这是行为改变的关键：

```python
def _blueprint_hint(skill, limit=900):
    bp = skill.get("blueprint") or {}
    traj = [str(t) for t in (bp.get("trajectory") or [])
            if not str(t).startswith("<")]
    if not traj:
        return ""
    hint = f"｜标准编排：{' → '.join(traj)}"
    if bp.get("strategy"):
        hint += f"（策略：{bp['strategy']}）"
    return hint
```

实测证据：注入 2 条技能但只给"做法描述"，轨迹仍是单工具；补上 `_blueprint_hint` 后重跑，轨迹变成两步——**行为真的改了**。

Sources: [mve/voyager.py:758-828](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/voyager.py#L758-L828)

## 消费侧复用链路

### 消费只编排复用，不现做合成

这是 2026-10-25 拍板的边界：学过什么答什么，没学过就明说"未学"并踢回学习线。

```mermaid
sequenceDiagram
    participant User as 用户提问
    participant Consume as 消费线
    participant SkillStore as 技能库
    participant Compose as _compose_sql
    participant Critic as 判官

    User->>Consume: 消费请求
    Consume->>SkillStore: retrieve(topic, question)
    SkillStore-->>Consume: 命中配方列表
    alt 有命中配方
        Consume->>Compose: 多技能整批编排
        Compose->>Compose: 回填 :slot + 守卫闸
        Compose->>Compose: 逐条执行取真数
        Compose-->>Consume: 数据行 + 来源标注
        Consume->>Critic: critic + 裁判独立复核
        Critic-->>Consume: 判分结果
        Consume-->>User: 叙事聚合回答
    else 无命中
        Consume-->>User: "未学" + 踢回学习线
    end
```

### 消费侧两条入口与完整度差异

| 入口 | 接了哪几闸 | 缺什么 |
|---|---|---|
| `voyager_vlml/consume.py`（VLML 消费线） | 闸三 `has_real_data` | `source_binding` / 搬运判据 / `reason_demos` 全 0 |
| `mve/coach.py:528 explain`（面板聊天） | **一闸都没接** | 真空防线 + 来源绑定 + 搬运判据 + 示范召回，全缺 |

修的方向：把这两条入口补齐（先 coach.explain 的真空防线），**绝不是**"让两侧判据一致"——那会破坏「尺子不进反馈环」的设计。

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236), [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245)

## 掌握度与判分规则

### 尺子只有一把：消费侧

学习侧**不判分**（练习），只有消费侧判分。理由：判分的尺子不能进学习反馈环，否则它学会的是"讨好裁判"。学习侧的 critic 只是过程控制信号（驱动闭合计数/技能入库），**不作数、不能当能力证据**。

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236)

### 求助闭环与掌握度折扣

```mermaid
graph TD
    A[判错] --> B[粗粒度反馈]
    B --> C{decide_help}
    C -->|有未试工具| D[先自己试]
    C -->|都试过仍不行| E[求助 VLML0 解释]
    E --> F[只带回做法不给数值]
    F --> G[带解释重做本题]
    G --> H[掌握度重算 used_hint=True]
    H --> I[得分打0.85折]
    H --> J[半衰期不动]
```

| 位置 | 规则 | 用了帮助时 |
|---|---|---|
| `mastery_v2.py:36` + `:391-396` | `hint_used_modifier = 0.85` | 得分**打 0.85 折**计入 attempt_quality |
| `mastery_retention.py:46-51` | `correct 且 used_hint=False` 才拉长半衰期 | 走 else 分支，半衰期**不动** |

Sources: [知识图谱与求助闭环.md:1-156](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L1-L156), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

## 部署与验证流程

### 新场景接入三步

```mermaid
graph TD
    A[1. 本地开发] --> B[2. 服务器同步]
    B --> C[3. 重启面板]
    A --> A1[代码在 ~/mve-repo]
    A --> A2[测试全绿]
    B --> B1[git push main + feature]
    B --> B2[服务器 git reset --hard]
    C --> C1[systemctl restart mve-panel]
    C --> C2[验证面板 API]
```

### 验证清单

| 步骤 | 命令/操作 | 预期 |
|---|---|---|
| 本地测试 | `python mve/test_reason_pass.py` | 45/45 过 |
| 服务器同步 | `git fetch && git reset --hard origin/feature/1-to-n-pluggable-scenes` | SHA 一致 |
| 重启面板 | `systemctl restart mve-panel` | 服务正常 |
| 验证 API | `curl http://172.18.0.1:8777/mve/api/overview` | 返回 JSON |
| 验货新库 | 面板「验货」按钮 | 报出表数、事件数、series 状态 |
| 清库重学 | `python mve/reset_all.py --scene X` | 场景 X 全部账清零 |

Sources: [HANDOFF.md:1-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L1-L66), [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245)

### 环境注意事项

| 坑 | 说明 |
|---|---|
| 服务器没有 pytest | 只能 `python mve/test_xxx.py` |
| 本地没有 duckdb | 数据类测试必须服务器跑 |
| worktree 陷阱 | `git worktree add` 出来的目录没有 `mve/.env` → `chat_json` 全失败 |
| 探测地址 | 容器内服务只认 `http://172.18.0.1:8777`，`127.0.0.1` 不通 |
| 重启前必查 | `pgrep -af 'scene_learn|pilot'`，有活循环先 `curl -X POST .../pilot/stop` |
| Caddy 配置 | 改 Caddyfile 必须同步改 `/root/neko/加一层口令.sh` 模板 |

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

## 已知限制与诚实标注

新场景接入时需注意以下产品级限制：

| # | 限制 | 影响 | 是否可修 |
|---|---|---|---|
| 1 | 技能绑死题目，不迁移 | 存下来的调用序列里写死了 `series_id` / 地图名，迁移考核 0% | 需参数化程序 |
| 2 | 消费判分是软尺子 | 主尺子是"两边做法的比对"（LLM 判），不是题库既有 rubric | 设计如此 |
| 3 | 图谱不消费 `ext_*` 表 | 表节点只从种子题 rubric SQL 派生 | 需扩展图谱构建 |
| 4 | 公开源缺 `agg_*` 派生层 | 9 张派生表在公开源都是 0 行 | 需做派生计算 |
| 5 | `player_profile_report` 必然失败 | VLML 写死查 `agg_player_game_stats`（公开源 0 行） | 需改 VLML 上游 |
| 6 | 种子题实体写死 | 6 道任务 SQL 写死了 GRID 图名/队名 | 需锚点化 |
| 7 | 考核线未迁新后端 | 摸底/结业考仍走旧 `exam.py` | 待迁 |
| 8 | 掌握度挂在 `topic_id` 上 | 不是「组合归档成的类」 | 需改聚合方式 |

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236), [docs/README-学习机制详解-2026-10-13-存档.md:1505-1577](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1505-L1577)

## 总结

新场景接入的核心是**命名空间隔离 + 数据源注册 + 知识图谱冷启动**三步。MVE 的 1→n 架构确保学习引擎对场景透明——同一套闭环在不同数据域上独立运行，技能库按场景隔离，面板按 `scene.id` 过滤。关键设计约束包括：尺子不进反馈环（学习侧不判分）、消费只编排复用不现做合成、图谱边来源必须是声明或实测不能是模型编的。接入新场景时务必注意公开源的 `agg_*` 派生层为空、种子题实体写死等已知限制，并通过面板验货和清零重学验证闭环完整性。
