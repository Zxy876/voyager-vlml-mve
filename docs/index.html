# 项目概览与定位

## 一句话定位

**Voyager-VLML · MVE** 是一个**端侧大模型能力验证框架**——它不训练模型，参数永远不动，而是让 agent 在真实数据库环境里自己出题、自己取数、自己被判卷、把跑通的做法结晶成技能，再用消费线检验：换一个模型接进来，已学技能还在不在、答案还判不判得对——**差距就是该模型在这个环境里的真实能力**。

习得是手段，验证是目的。被测对象是接入的 LLM；技能库、判官、防幻觉闸都是量具。

Sources: [README.md:1-12](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L12), [HANDOFF.md:20-27](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L20-L27)

## 三个不可混淆的定位

| # | 定位 | 说明 |
|---|---|---|
| 1 | **不训练模型** | 2026-10-29 会议拍板，不做 RL/微调。验证对象是**架构**，不是模型权重。换掉外接 LLM（flash ↔ glm-4.6）闭环照跑 → 它因此能当「任意小模型的学习能力测试台」 |
| 2 | **判官是另一个 LLM + 确定性闸门** | 不是神经 reward model（DeepSeek R1 §2.2 同结论：推理任务只用规则可验信号） |
| 3 | **同构不只是比喻** | episode=rollout / horizon=4 步 / policy=ActionAgent / reward model=critic / 经验复用=技能库 —— 这是 Tianshou 的 MDP 五元组落到产品上的形态。`reward` 恒 0 与原版 Voyager 一致，真信号在 `info["success"]` + 判词 |

Sources: [HANDOFF.md:20-27](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L20-L27)

## 与原版 Voyager 的同构关系

本设计源自 Voyager（Wang et al., 2023）开创的范式：把"学习"从改模型权重换成**改可执行的技能库**——环境反馈不回传梯度，而是回传一个**判卷结论**；经验不是存成样本对，而是结晶成**可检索、可组合、可重放的程序**。原版在 Minecraft 里验证，本仓库把它搬进**真实数据库世界**并做成了按场景隔离、可插拔泛化的通用框架。

> **换一个数据源 + 注册可执行动作，同一个学习引擎就能在新领域从零开课——这就是 1→n。**

| 维度 | 原版 Voyager | 本系统（MVE） |
|---|---|---|
| 环境 | Minecraft（视觉/方块） | 真实 DuckDB/SQLite 数据库 + 本机文件 + MCP 工具 |
| 动作空间 | JS 代码调 Mineflayer API | SQL / Python 调 `query_sql`、MCP、本机只读原语 |
| 学习信号 | 环境事件 + 自我判卷（critic） | **真实取到数没有** + critic + 三道确定性守卫 |
| 经验结晶 | JS 技能库（Chroma 向量检索） | SQL 配方库（embedding 检索 + 字面量守卫） |
| 泛化评估 | 无（开放世界） | **消费线**：人问一句，用已学能力作答，判掌握 |

Sources: [README.md:39-56](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L39-L56)

## 核心闭环架构

从一次提问到技能入库的完整闭环：

```mermaid
graph TD
    A[场景 Scene] --> B[里程碑拆维度]
    B --> C[逐维度出题]
    C --> D[执行 工具/MCP]
    D --> E[判据 + 判官]
    E --> F{闭合?}
    F -->|全闭合/部分闭合| G[验对轨迹入库]
    F -->|未闭合| H[反馈 + 求助判断]
    G --> I[generalize 去数值]
    I --> J[技能库 配方/程序]
    J --> C
    H --> C
```

Sources: [HANDOFF.md:28-35](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L28-L35)

### 闭环各环节详解

```mermaid
sequenceDiagram
    autonumber
    participant S as 场景
    participant C as 课程/出题器
    participant V as Voyager执行层
    participant E as 环境/工具
    participant J as 判官
    participant K as 技能库

    S->>C: 里程碑拆维度
    C->>V: 派发题目
    V->>K: 检索已有技能
    K-->>V: 返回配方/程序
    V->>E: 执行工具/MCP取数
    E-->>V: 返回真实数据
    V->>J: 提交执行结果
    J-->>V: 判卷结论 {verdict, quotes, gap}
    alt 判对
        V->>K: 结晶技能入库
    else 判错

    end
```

Sources: [README.md:69-95](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L69-L95), [HANDOFF.md:28-35](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L28-L35)

## 学习线与消费线的双线架构

```mermaid
graph TD
    subgraph 学习线
        L1[课程出题] --> L2[维度拆解]
        L2 --> L3[rollout执行]
        L3 --> L4[判卷]
        L4 --> L5[技能结晶]
    end

    subgraph 消费线
        C1[人提问] --> C2[技能检索]
        C2 --> C3[多配方编排]
        C3 --> C4[叙事聚合]
        C4 --> C5[掌握度记账]
    end

    L5 -.->|技能库共享| C2
    C5 -.->|未学标记| L1
```

**关键设计铁律**：判分的尺子不能进学习反馈环，否则它学会的是"讨好裁判"。学习侧的 critic 只是过程控制信号（驱动闭合计数/技能入库），**不作数、不能当能力证据**。只有消费侧判分。

Sources: [HANDOFF.md:192-210](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L210), [README.md:176-186](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L186)

| 入口 | 接了哪几闸 | 缺什么 |

## 数据契约：产出是事实集，不是一段话

Voyager 每轮产出：**SQL + 真实行数据 + 来源工具清单 + 判卷结论**。叙事（给人看的自然语言回答）单独一层产出，且**声明不参与判分**——判分只看：取到真数没有、方法与裁判比对是否同量、字面量是否全部可指认。

Sources: [README.md:176-180](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L180)

## 两层调度机制

这是最容易抄错的地方，已逐行核对过原版：

```mermaid
graph TD
    subgraph 整题层
        T1[learn 循环] --> T2{任务成功?}
        T2 -->|成功| T3[记 completed_task]
        T2 -->|失败| T4[记 failed_task + 冷却]
        T4 --> T5[换题 / 降级自由出题]
    end

    subgraph 子目标层
        S1[inference 循环] --> S2[逐维度重试]
        S2 --> S3{子目标成功?}
        S3 -->|成功| S4[推进下一维度]
        S3 -->|失败| S5[重试本维度]
    end

    T1 --> S1
```

| 层 | 原版语义 | MVE 落地 |
|---|---|---|
| 整题层 | `learn()`：任务失败进 `failed_tasks`，**换题** | 里程碑：失败 → 挂冷却 → 降级自由出题 |
| 子目标层 | `inference()`：`while sub_goals`，题内不跳过 | 维度：逐维度重试 |

Sources: [HANDOFF.md:96-115](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L96-L115)

### 三个铁律

1. **原版没有「整题总验收」层**。`inference()` 的完成判据只是「最后一条子目标成功」
2. **原版对做不出的任务从不原地无限重试**：单任务封顶 4 次 → 记 failed + 换题。MVE 已封顶 4 次 + 冷却（`MAX_RETRY_STREAK = 4`）
3. **骨架拆一次就固定，永不因失败重拆**。曾按失败指纹重拆 → 维度 id 每轮变 → 闭合账全对不上

Sources: [HANDOFF.md:100-115](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L100-L115)

## 知识图谱作为 control_primitives 的等价物

原版 Voyager 能写出能跑的 JS，是因为 `render_system_message()` 把 **control_primitives 的源码**拼进 system message——模型看得到实现，不只是函数名。MVE 的同构物是知识图谱：

```mermaid
graph TD
    subgraph 原版Voyager
        CP[control_primitives 源码] --> SM1[System Message]
        SM1 --> M1[模型写出可执行JS]
    end

    subgraph MVE
        KG[知识图谱子图] --> SM2[Prompt注入]
        SM2 --> M2[模型写出正确SQL]
    end

    subgraph 图谱内容
        SEM[指标语义 semantics]
        REC[脱敏骨架 recipe]
        COL[列映射 columns_by_table]
        ERR[典型错法 typical_errors]
    end

    KG --> SEM
    KG --> REC
    KG --> COL
    KG --> ERR
```

### A/B 实测证据（corrode_collapse 题，第 1 轮，不求助）

| 组 | 首血转换率 | 连败 SQL | 连败值/起点 | 覆盖率 |
|---|---|---|---|---|
| A：无图谱 | 0.0 | 列都错了 | 5/2 | 0% wrong |
| B：图谱只作提示 | 25.0 ✓ | 骨架对，过滤位置错 | 13/1 | 20% partial |
| D：图谱+结构/参数断言 | 25.0 ✓ | 完全正确 | **8/7 ✓** | **100% correct** |

Sources: [知识图谱与求助闭环.md:185-298](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L185-L298), [mve/voyager.py:758-828](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/voyager.py#L758-L828)

## 诚实标注与已知限制

### 核心诚实标注

- 掌握度不是分数，是**能力集合计数**；覆盖率是只给人看的质量分，不进反馈环
- 本框架**不训练模型**：无梯度、无回放缓冲、无神经奖励模型
- 与 RL 的对应（episode / horizon / policy / critic）只是**同构分析视角**，不做强化学习训练
- 所有同构对照均给出原版 file:line；自定项在代码注释里逐条标明

Sources: [README.md:247-268](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L247-L268)

### 产品级已知限制

| # | 限制 | 说明 |
|---|---|---|
| 1 | 技能绑死题目，不迁移 | 存下来的调用序列里写死了 `series_id` / 地图名，迁移考核 0% |
| 2 | 消费判分是软尺子 | 主尺子是「两边做法的比对」（LLM 判），不是题库既有 rubric |
| 3 | 图谱不消费 `ext_*` 表 | 表节点只从种子题 rubric SQL 派生 |
| 4 | 公开源缺 `agg_*` 派生层 | 9 张派生表在公开源都是 0 行，但原料在 `ext_*` 表里 |
| 5 | `player_profile_report` 必然失败 | VLML 写死查 `agg_player_game_stats`（公开源 0 行） |
| 6 | 种子题实体写死 | 6 道任务 SQL 写死了 GRID 图名/队名，rib 库里不存在 |
| 7 | 考核线未迁新后端 | 练习线已迁，摸底/结业考仍走旧 `exam.py` |
| 8 | 掌握度挂在 `topic_id` 上 | 不是「组合归档成的类」：设计要按组合类算，代码目前按题聚合 |

Sources: [HANDOFF.md:216-228](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L216-L228)

## 总结

MVE 项目的核心定位是**端侧大模型能力验证框架**，而非模型训练框架。它通过将 Voyager 的「技能库替代参数更新」范式从 Minecraft 搬迁到真实数据库世界，构建了一条完整的学习→验证闭环：学习线通过出题→执行→判卷→结晶积累技能，消费线通过检索→编排→叙事检验已学能力的真实性。两条线共享技能库但判分尺子严格隔离——学习侧不判分，消费侧才判分，防止"讨好裁判"问题。框架支持 1→n 可插拔场景扩展，知识图谱作为原版 control_primitives 的等价物注入 prompt，A/B 实测证明其对模型行为有决定性影响。所有设计均与原版 Voyager 保持同构并给出 file:line 级对照，已知限制在白皮书中诚实标注。

# 与原版 Voyager 同构对照

MVE 项目以原版 MineDojo/Voyager 为同构蓝本，将「Minecraft agent 学技能」的闭环移植到 VLML 数据库取数场景中。同构意味着 MDP 五元组（episode / horizon / policy / critic / 经验复用）逐条可映射到原版代码的 `file:line`，而非仅作比喻。本文档逐机制对照原版实现，标注 MVE 落地点、同构换维处及自定增量，使开发者能快速定位组件、验证一致性、避免重复踩坑。

Sources: [README.md:81-136](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L81-L136), [HANDOFF.md:49-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L66), [docs/README-学习机制详解-2026-10-13-存档.md:866-919](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L866-L919)

## 核心闭环对照

原版 Voyager 的核心闭环是「环境观察 → 任务提议 → 技能检索 → 代码执行 → critic 判定 → 成功固化技能 → 下一轮」。MVE 将每个环节替换为 VLML 等价物，闭环形状不变。

```mermaid
graph TD
    A[场景/里程碑] --> B[出题器选题]
    B --> C[技能库检索]
    C --> D[执行层编排]
    D --> E[判据+判官]
    E --> F{success?}
    F -->|Yes| G[技能入库]
    F -->|No| H[失败账本]
    G --> I[里程碑推进]
    H --> I
    I --> B
```

Sources: [README.md:81-136](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L81-L136), [HANDOFF.md:49-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L66)

### 闭环逐环节映射

| 环节 | 原版 Voyager | 原版位置 | MVE 对应 | MVE 落地文件 |
|---|---|---|---|---|
| 任务提议 | `curriculum.propose_next_task()` | `curriculum_agent` | 里程碑锚点优先 → 最弱优先自动出题 | `mve/curriculum_auto.py` |
| 子目标分解 | `voyager.py:403-435 inference` | 同 | Maieutic 追问骨架拆维度 | `mve/curriculum_auto.py` |
| 技能检索 | `skill_store.retrieve()` | `voyager.py:195/199` | embedding 余弦盲取 top_k | `mve/skill_store.py` |
| 整批注入 | `programs` | `action.py:94` | 检索到的配方整批注入 `agent.solve` | `mve/voyager.py` |
| critic 反馈 | `render_human_message(critique=)` | `:231-234` | critique 进 context 槽（`_hint_ctx`） | `mve/voyager.py` |
| 成功固化 | `add_new_skill(info)` | `voyager.py:230` | 入库三道关：守卫 → fan-out 闸 → 真数 | `mve/voyager.py` |
| 内层重试上限 | `task_max_retries=4` | `voyager.py:30` | `solve` 4 步迭代 | `mve/learn_orchestrate.py` |

Sources: [README.md:81-136](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L81-L136), [docs/README-学习机制详解-2026-10-13-存档.md:806-880](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L806-L880)

## 两层调度对照

原版 Voyager 有明确的两层循环结构：外层 `learn()` 遍历任务、内层 `inference()` 处理子目标。MVE 同构落地为「整题层（里程碑）+ 子目标层（维度）」。

Sources: [HANDOFF.md:92-142](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L92-L142)

### 原版两层结构

```mermaid
sequenceDiagram
    participant L as learn()外层
    participant I as inference()内层
    participant C as CurriculumAgent
    participant S as SkillManager
    participant E as Environment

    L->>+C: propose_next_task()
    C-->>-L: task
    L->>+I: inference(task)
    loop 每个子目标
        I->>+S: retrieve_skills(context)
        S-->>-I: programs[]
        I->>+E: execute(program)
        E-->>-I: events
        alt success
            I->>S: add_new_skill(info)
        else fail
            I-->>I: 继续下一子目标
        end
    end
    I-->>-L: info
    L->>C: update_exploration_progress(info)
```

Sources: [voyager_original/voyager/voyager.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/voyager.py), [voyager_original/voyager/agents/curriculum.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/agents/curriculum.py)

### MVE 两层调度落地

| 层 | 原版语义 | MVE 落地 | 关键差异 |
|---|---|---|---|
| 整题层 | `learn()`：任务失败进 `failed_tasks`，**换题** | 里程碑：失败 → 挂冷却 → 降级自由出题 | MVE 加冷却闸防死循环 |
| 子目标层 | `inference()`：`while sub_goals`，题内不跳过 | 维度：逐维度重试 | 同构 |

Sources: [HANDOFF.md:92-142](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L92-L142)

### 三个铁律

1. **原版没有「整题总验收」层**。`inference()` 完成判据只是「最后一条子目标成功」（`voyager_original/voyager.py:417`，`progress = len(completed_tasks)`）。MVE 不自造总验收。
2. **原版对做不出的任务从不原地无限重试**：单任务封顶 `action_agent_task_max_retries=4`（`voyager.py:30,277-280`）→ 记 failed + 换题。MVE 已封顶 4 次 + 冷却（`MAX_RETRY_STREAK = 4`）。
3. **骨架拆一次就固定，永不因失败重拆**。曾按失败指纹重拆 → 维度 id 每轮变 → 闭合账全对不上。

Sources: [HANDOFF.md:92-142](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L92-L142), [voyager_original/voyager/voyager.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/voyager.py)

## 技能库对照

### 原版技能库机制

原版技能库核心逻辑在 `voyager/agents/skill.py`：

| 机制 | 原版做法 | 原版出处 | MVE 落地 |
|---|---|---|---|
| 存储结构 | `dict[program_name]`，同名**覆盖** | `skill.py:add_new_skill` | `skill_store.add()` → `added / rewritten / skipped` |
| 检索 | `similarity_search_with_score(query, k=k)` 取 top_k=5 | `skill.py:retrieve_skills` | `skill_store.retrieve(top_k=5)` |
| 去重 | 同名 Rewriting（"already exists. Rewriting!"） | `skill.py:53-55` | `DUP_THRESHOLD=0.62`，相似度 ≥0.62 → 覆盖 |
| 无用技能不入 | "Deposit useless items" | `skill.py:add_new_skill` | 少于 12 字 / 相似度 ≥0.90 → 丢弃 |
| 检索键 | 任务文本（`voyager.py:195`） | 同 | `topic` 预过滤 + 词面 Jaccard |

Sources: [voyager_original/voyager/agents/skill.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/agents/skill.py), [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177), [docs/README-学习机制详解-2026-10-13-存档.md:1505-1577](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1505-L1577)

### 技能↔里程碑关系

原版中技能和里程碑**不是挂靠关系，是同一件事的两种记账**：

- 任务文本进 `completed_tasks`（里程碑），解法进技能库（技能）
- 下一轮出题时用任务文本把解法检索回来
- 连接点只有主循环里两行（`voyager.py:369-372`）：

```python
if info["success"]:
    self.skill_manager.add_new_skill(info)      # 解法进技能库
self.curriculum_agent.update_exploration_progress(info)   # 任务文本进里程碑
```

MVE 同构落地：

| 原版 | MVE | 差异 |
|---|---|---|
| `completed_tasks` 列表 + `progress=len()` | `mve/run_log.jsonl` + `loop_state.json` 的 `progress` | 额外落盘供面板可读 |
| `program_code`（JS 源码） | 技能库 `code` 字段 = **一整条 SQL 配方** | VLML 世界里"代码"就是取数 SQL |
| Chroma 向量检索 | 词面 Jaccard 相似 + topic 预过滤 | 无向量库环境的近似 |
| 同名 Rewriting | `add()` 的 `rewritten` 分支 | 增加相似度阈值去重 |

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796), [voyager_original/voyager/voyager.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/voyager.py)

## 判据层对照

### 原版 critic 机制

原版 `critic.py` 的判定逻辑：

- `check_task_success()` 是布尔 self-verification：环境里任务目标真的达成 = 成功
- 事件里出现 `onError` 直接判失败（`critic.py:39-42`）
- 只读原始 `events` 判定，`summarize_chatlog` 在判定**之后**才生成

Sources: [voyager_original/voyager/agents/critic.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/agents/critic.py), [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708)

### MVE 判据层 vs 掌握度层

MVE 将判据与掌握度严格分层：

| 层 | 归属 | 读什么 | 用途 |
|---|---|---|---|
| **判据层** | Voyager（学习主体） | `ev.success` 布尔 | 存技能 / 停止同题 / 推进换题 / 迁移考核 |
| **掌握度层** | 伴学（评估量尺） | mastery_v2 五档 + 覆盖率 | 只衡量"独立面对公开库时运用得多好"，**不决定练什么** |

**判错不能写技能库**：做法已被裁判证明是错的，写进去就是往库里埋雷。实测反例：pistol_eco_pattern 攒下错经验后，覆盖率从 80% 掉到 45%。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:866-880](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L866-L880), [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

## 防幻觉对照

### 原版防幻觉机制

原版 Voyager 通过回灌原始事件防幻觉：

| 原版做法 | 出处 | MVE 落地 |
|---|---|---|
| 回灌**代码全文**，不是函数名 | `action.py:render_human_message` | `_note_attempt()` 记含失败调用的 SQL 原文并回灌 |
| 缺失项显式写 `No code / No error / None` | 同上 | `_render_observation()` 四项全部显式写 None |
| 解析失败 retry=3 + 严格断言 | `action.py:process_ai_message` | `_validate_plan()` 工具名白名单 + 重试 3 次 |
| 事件里出现 `onError` 直接判失败 | `critic.py:39-42` | 工具全挂 → 跳过抽取，不让它对着错误编数字 |
| 只出可验证的题 | `curriculum.txt` 第 8 条 | `answer_spec` 确定性 SQL |

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177), [voyager_original/voyager/agents/action.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/agents/action.py), [voyager_original/voyager/agents/critic.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/agents/critic.py)

### MVE 在原版之上的四个增量

1. **防幻觉三闸**（原版没有，真实数据库必需）：
   - **字面量守卫**：SQL 里每个筛选值必须能在 `db_observation` 实查清单里指认
   - **fan-out 闸**：跨一对多 JOIN 把驱动表行放大再聚合 = 乘爆，确定性拒绝
   - **真空防线**：空表聚合返回 1 行 `(NULL, 0)` 不算取到数

2. **场景隔离 1→n**：技能带 `source_scene`，检索按 `{本场景, default}` 过滤

3. **知识图谱 = control_primitives 的等价物**（见下节）

4. **事实溯源**（后置硬校验）：数值必须在工具返回里真的出现过

Sources: [README.md:81-136](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L81-L136), [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

## 知识图谱与 control_primitives 同构

### 原版 control_primitives 的作用

原版 Voyager 能写出能跑的 JS，核心原因是 `render_system_message()` 把 **control_primitives 的源码**拼进了 system message——模型看得到每个技能函数的实现，不只是函数名（`voyager/agents/action.py:render_system_message`）。

Sources: [mve/voyager:758-828](), [voyager_original/voyager/agents/action.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/agents/action.py)

### MVE 的等价物：知识图谱注入 prompt

MVE 之前图谱只喂给面板可视化，Voyager 规划时一行都看不到，只能猜列名。同构改造：把「这个指标怎么算 / 读哪张表 / 用哪些列 / 别人常错在哪」作为**本题相关子图**注入 prompt。

```mermaid
graph TD
    A[control_primitives源码] --> B[原版system_message]
    C[知识图谱子图] --> D[MVE规划prompt]
    E[图谱常驻上下文] --> D
    F[求助VLML0解释] --> G[伴学意义帮助]
    G --> H[打0.85折]
    E --> I[不打折]
```

关键区分：图谱是**常驻**上下文（像 control_primitives 一直在 system 里），不计入 `used_hint`、不打掌握度折扣；求助（VLML0 解释）才是伴学意义上的"借助帮助"，要打 0.85 折。

Sources: [mve/voyager:758-828](), [进度对照.md:822-932](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L822-L932)

### A/B 实测结果

| 条件 | corrode_collapse 第 1 轮覆盖率 |
|---|---|
| A：无图谱 | 0%（列名全猜错） |
| B：图谱只作提示 | 100%（第 1 轮即闭合） |

## 反馈链路对照

### 原版反馈通路

原版 Voyager 的反馈是**原始事件进判定**：

- 观察**原样**读 events 字段拼进 prompt（`action.py` 的 `render_human_message`）
- critic 读原始 events 判定
- `summarize_chatlog` 在判定**之后**才生成，只用于检索
- 落盘 `recorder.record(events, task)` —— 原始事件流水

### MVE 的取证修正

MVE 此前是「誊抄本进判定」，已做两处无损修复：

1. `trajectory` 补回 `result`（之前只存 tool+args，把响应丢了）
2. `got_value is None` → 记 `未取到值：模型交了 null`，不再进值比对

Sources: [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708), [voyager_original/voyager/agents/action.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_original/voyager/agents/action.py)

## 两条线对照

原版 Voyager 只有学习线（`learn()`），MVE 增加消费线形成双线结构，但共用同一套技能库与图谱，**账本分开**。

| | 学习线（`scene_learn` → `learn_orchestrate`） | 消费线（`consume.py`） |
|---|---|---|
| 谁出题 | 里程碑课程（人导入 / 自动出题器） | **人写一句想问的话** |
| 做什么 | 拆维度 → 逐维度 rollout → 取真数 → 结晶技能 | **用已积累的能力回答** |
| 成败判据 | `success` = 真的从 DB 取到数 | 取到真数 + 叙事给出有据回答 |
| 算不算分 | **不算** | **从这里开始算** |
| 判分给谁看 | 不给任何人 | **只给人看**，绝不回灌学习线 |

**设计铁律**：判分的尺子不能进学习反馈环，否则它学会的是"讨好裁判"，不是"取到数"。

Sources: [README.md:81-136](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L81-L136), [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236)

```mermaid

```

| 同构维度 | 原版 | MVE | 状态 |
|---|---|---|---|
| 学习单元 | `curriculum.propose_next_task()` | `Task`（loop_core） | ✅ 世界观映射 |
| 判据 | `critic.check_task_success` 布尔 | `ev.success` / 新后端 critic | ✅ 照抄 + DB 实查更硬 |
| 成功固化 | `if info["success"]: add_new_skill` | 跑通才存技能 | ✅ 照抄 |
| 技能库 | `program_name` 主键 + Rewriting | `{topic_id}解法`；词面 Jaccard | ✅ 照抄 + 自标近似 |
| 进度 | `progress = len(completed_tasks)` | 裸考画像 / 消费累计掌握数 | ✅ 照抄 |
| 失败处理 | 失败即跳过 | failed 账本 + mastery/半衰期调度 | ✅ 融合换维 |
| 自适应出题 | curriculum 读 progress/completed/failed/skills | planner 优先级链 | ✅ 照抄方向 |
| 终极判据 | `skill_library_dir` + `resume=False` | exam transfer/final | ✅ 照抄 |

MVE 在保持与原版 Voyager 逐条同构的基础上，针对数据库取数场景增加了防幻觉三闸、场景隔离、知识图谱注入、事实溯源四个增量。所有自定项均在代码注释里逐条标明，所有同构对照均给出原版 `file:line`。同构不是比喻——episode/horizon/policy/critic/经验复用的 MDP 五元组落到产品上的形态，可在原版与 MVE 之间逐行验证。

# 核心循环架构总览

MVE 的核心循环是从原版 Voyager（Wang et al., 2023）的 Minecraft 技能习得范式同构迁移到真实数据库世界的产物。它不改模型权重，而是让 agent 在环境中自己出题、取数、被判卷，把跑通的做法结晶成可检索、可组合、可重放的技能（SQL 配方）。整个系统由**两层调度**驱动：外层整题层（里程碑/课程）负责换题与冷却，内层子目标层（维度）负责逐维度重试——这一结构与原版 `learn()/inference()` 两层严格对应。习得是手段，验证是目的：换一个 LLM 接进来，已学技能是否还在、答案是否仍对——差距就是该模型的真实能力。

Sources: [README.md:1-69](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L69), [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

## 两层调度：整题层 × 子目标层

两层调度是整个架构最容易抄错的地方。原版 Voyager 的 `learn()` 对应整题层，`inference()` 对应子目标层，MVE 严格按此落地。

| 层 | 原版语义 | MVE 落地 | 关键文件 |
|---|---|---|---|
| 整题层 | `learn()`：任务失败进 `failed_tasks`，**换题** | 里程碑：失败 → `note_milestone_round(new_closed=0)` 挂冷却 → 降级自由出题 | `mve/scene_learn.py` |
| 子目标层 | `inference()`：`while sub_goals`，题内不跳过 | 维度：逐维度重试，封顶 4 次 | `mve/learn_orchestrate.py` |

Sources: [HANDOFF.md:124-180](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L124-L180), [docs/maieutic-外包课程规划.md:58-149](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/maieutic-外包课程规划.md#L58-L149)

### 三条铁律

1. **原版没有「整题总验收」层**。`inference()` 的完成判据只是「最后一条子目标成功」（`voyager_original/voyager.py:417`，`progress = len(completed_tasks)`；`curriculum.py:133-135`）。不能自己发明总验收。
2. **原版对做不出的任务从不原地无限重试**：单任务封顶 `action_agent_task_max_retries=4`（`voyager.py:30,277-280`）→ 记 failed + `"Skipping to next task."`（`curriculum.py:340-344`）→ 下一轮换题。把 `inference()` 的「失败不跳过」抄进训练循环 = 死循环（实测 26 轮同一个题）。MVE 已封顶 4 次 + 冷却（`MAX_RETRY_STREAK = 4`）。
3. **骨架拆一次就固定，永不因失败重拆**。曾按失败指纹重拆 → 维度 id 每轮变 → 闭合账全对不上。

Sources: [HANDOFF.md:124-180](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L124-L180)

### 常数对照

| 参数 | 原版值 | MVE 值 | 出处 |
|---|---|---|---|
| 子任务重试上限 | `action_agent_task_max_retries=4` | `SUBTASK_MAX_RETRIES=4` / `INNER_MAX_ITERS=4` | `voyager.py:30` / `learn_orchestrate.py:169` |
| 外层重试 | `--max-retries` 默认 1 | 默认 1 | — |
| 外层墙钟 | — | 90s | — |

## 核心闭环：从提问到技能入库

核心闭环描述了从一次提问到技能入库的完整数据流，是整个系统的引擎。

```mermaid
graph TD
    A[场景 scene] --> B[里程碑拆维度]
    B --> C[逐维度出题]
    C --> D[执行 工具/MCP]
    D --> E[判据 + 判官]
    E --> F{闭合?}
    F -->|全闭合/部分闭合| G[验对轨迹入库]
    F -->|未闭合| H[反馈回灌]
    H --> C
    G --> I[generalize 去数值]
    I --> J[技能库 配方/程序]
    J --> C
```

Sources: [HANDOFF.md:49-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L66), [README.md:1-69](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L69)

### 闭环各环节详解

| 环节 | 职责 | 对应原版 | MVE 落地文件 |
|---|---|---|---|
| 课程（出题） | 人导入里程碑 / 自动课程最弱优先推进 | `curriculum.py:propose_next_task` | `mve/curriculum_auto.py` |
| 技能检索 | 按任务文本/维度检索已学技能 | `skill.py:retrieve_skills` (Chroma 向量) | `mve/skill_store.py` (embedding + Jaccard) |
| Rollout（执行层） | 写 SQL → 执行 → 取回真数 | `action.py:solve` → JS 代码 | `voyager_vlml/loop.py` → SQL |
| 判据 + 判官 | 确定性守卫 + LLM critic | `critic.py:check_task_success` | `mve/task_critic.py` |
| 技能入库 | 成功 rollout 的解法结晶 | `skill_manager.add_new_skill` | `skill_store.add()` |
| 里程碑记账 | 任务文本进 completed_tasks | `update_exploration_progress` | `mve/maieutic_scaffold.py` |

Sources: [README.md:1-69](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L69), [HANDOFF.md:67-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L67-L123)

## 主循环逐步对照：一个 Task 内的执行流程

以下是一个 task 之内从"给出代码"到"记一次成败"的完整步骤，逐条与原版对照：

```mermaid
sequenceDiagram
    autonumber
    participant Pilot as 驾驶舱
    participant Loop as loop.run_one_round
    participant Action as ActionAgent
    participant Env as 环境(DuckDB/MCP)
    participant Critic as Critic

    Pilot->>+Loop: 启动一轮学习
    Loop->>Loop: 检索技能 _retrieve_skills
    Loop->>+Action: solve(question, skills, critique)
    Action->>Action: 渲染 system_message (原语+技能)
    Action->>Action: LLM 产出动作 (SQL)
    alt 解析失败
        Action-->>Action: continue (算一次失败)
    else 解析成功
        Action->>+Env: run_sql / env.step(code)
        Env-->>-Action: 执行结果 (rows/error)
        Action->>+Critic: check_task_success(events)
        Critic-->>-Action: verdict + critique
        alt 成功
            Action-->>Loop: success=True, code, result
            Loop->>Loop: skill_store.add(code=sql)
        else 失败
            Action-->>Loop: success=False, critique
            Note over Loop: 回灌 critique + 上一轮代码/结果, 重试
        end
    end
    Loop-->>-Pilot: 本轮结果

## 技能与里程碑的关系

### 原版关系（源码取证）

里程碑不是树，是 `CurriculumAgent` 的任务文本队列：

- `completed_tasks` 是一个**列表**，从 `curriculum/completed_tasks.json` 落盘恢复（`curriculum.py:51-57`）；`progress` property 就是 `len(self.completed_tasks)`（`curriculum.py:134-135`）—— **没有预建的技能树，进度 = 做完了几道题**。
- `update_exploration_progress(info)`：`info["success"]` 为真时把任务文本 `append` 进 `completed_tasks`（`curriculum.py:332-339`），失败进 `failed_tasks`。
- `propose_next_task()` 由 LLM 根据"已完成的任务 + 当前环境状态"生成下一道题（`voyager.py:335`）—— **题目是现想的，不是从树上下发的**。

技能与里程碑的连接点只有主循环里两行（`voyager.py:369-372`）：

```python
if info["success"]:
    self.skill_manager.add_new_skill(info)      # 解法进技能库
self.curriculum_agent.update_exploration_progress(info)   # 任务文本进里程碑
```

检索发生在 rollout 之前：`skills = self.skill_manager.retrieve_skills(query=self.context)`（`voyager.py:195`）—— **检索键是任务文本，没有 topic_id 路由层**。

**结论**：技能和里程碑不是"挂靠"，是同一件事的两种记账——任务文本进了 `completed_tasks`（里程碑），这道题的解法进了技能库（技能），下一轮出题时又用任务文本把解法检索回来。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1690-1732](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1690-L1732)

### MVE 同构落地

| 原版（行号） | MVE 落地 | 差异与理由 |
|---|---|---|
| `completed_tasks` 列表 + `progress=len()` | `mve/run_log.jsonl` + `loop_state.json` 的 `progress` | 同一语义；额外落盘为面板可读 |
| `program_code`（JS 源码） | 技能库的 `code` 字段 = **一整条 SQL 配方** | VLML 世界里"代码"就是取数 SQL |
| `skill_description`（LLM 生成） | `text` 字段（一句话方法） | 同构；MVE 的 text 带题面，检索键更实 |
| Chroma 向量检索，键 = 任务文本 | `skill_store.retrieve(topic, question)`：词面 Jaccard + topic 预过滤 | 无向量库环境的近似；topic 只做预过滤不当路由 |
| 同名 Rewriting（`skill.py:74-76`） | `add()` 的 `rewritten` 分支（`DUP_THRESHOLD=0.62`） | 近似去重 |

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1690-1732](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1690-L1732)

### 尺子只有一把：消费侧

**设计事实**：学习侧**不判分**（练习），只有消费侧判分。理由写在 `README.md:103` 与 `docs/README-学习机制详解-2026-10-13-存档.md:33`：**判分的尺子不能进学习反馈环，否则它学会的是"讨好裁判"**。学习侧的 critic 只是过程控制信号（驱动闭合计数/技能入库），**不作数、不能当能力证据**。

## 知识图谱与求助闭环

知识图谱回答的核心问题是：**这个维度该调哪个工具**。

```mermaid

    subgraph 知识图谱三层
        D[维度节点] --> T[工具节点]
        T --> S[表节点]
    end

    subgraph 五种边
        E1[produced_by]

### 求助闭环流程

```mermaid
sequenceDiagram
    autonumber
    participant Learn as 学习循环
    participant Decide as decide_help
    participant VLML0 as VLML0解释接口
    participant Skill as 技能库

    Learn->>Decide: 判错 + 反馈
    Decide->>Decide: gap=点名但没试过的工具
    alt gap非空
        Decide-->>Learn: 不求助 先自己试
    else gap为空
        Decide->>+VLML0: 求助(只带回做法 不给数值)
        VLML0-->>-Decide: 标准轨迹(做法)
        Decide->>Learn: 带解释重做
        Learn->>Learn: 掌握度重算(打0.85折)
    end
```

**求助纪律（硬规则）**：`gap`（点名但没试过的工具）非空时直接返回不求助，不问模型。

## 反馈链路与旁路学习

### 诊断：反馈链路曾经是空的

`learn()` 里两处产出都是**硬编码模板**（判对 `:1048-1050`、判错 `:1120-1124`），每轮只换维度名。更关键的是一个死结：

- 判错时**不写技能库**（错的做法写进去就是埋雷）；
- 于是学习**只可能发生在判对时**；
- 而判对时写的又是一条模板。

→ 技能库长期 1 条、内容模板生成。**学习几乎没发生。**

### 旁路学习已实现

`mve/bypass_learn.py`：跑 `vlml0_referee.answer` 拿标准轨迹 → 过滤内部标记 → LLM 提炼 `{name, lesson, defect, strategy}` → 写技能库（`source="bypass"`）。

`defect` 四类：`missing_dimension` / `wrong_granularity` / `tool_uncovered` / `value_form`
`strategy` 四类：`drill_down` / `switch_tool` / `combine_tools` / `read_scope`

**关键教训**：注入了 2 条技能，但轨迹仍是 1 步 —— **给"做法描述"没用，给"编排序列"才有用**。补上 `_blueprint_hint` 后重跑，轨迹变成两步 —— **行为真的改了**。

Sources: [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

## 知识图谱 = control_primitives 的等价物

### 原版凭什么能写出能跑的 JS

`render_system_message()` 把 control_primitives 的**源码**拼进 system message —— 模型看得到实现，不只是函数名。MVE 之前两样都缺：图谱里没有指标语义，而且**压根没进 prompt**。

### A/B 实测（corrode_collapse，第 1 轮，不求助）

| | A：无图谱 | B：图谱只作提示 | D：图谱 + 结构/参数硬断言 |
|---|---|---|---|
| 首血转换率 | 0.0（没算出） | 25.0 ✓ | 25.0 ✓ |
| 连败 SQL | 列都错了 | 骨架对，但队伍过滤提前到内层 | 完全正确 |
| 连败值 / 起点 | 5 / 2 | 13 / 1 | **8 / 7 ✓** |
| 覆盖率 | 0% wrong | 20% partial | **100% correct** |

**三条教训**：

1. **提示打不过强先验，得换成约束。** B 组把完整骨架 + 致命错法写进 prompt，模型**五次实跑一字不改**。加 SQL 结构断言后，一次就改对了。
2. **改一处会碰掉另一处。** 拦下 WHERE 位置后它顺手把 `GROUP BY (rn-grp)` 删了 → 必须两条断言一起上。
3. **"调对了工具"不等于"取得到值"。** 参数断言（语义必传 + 类型）加上后同样 100%。

Sources: [进度对照.md:902-992](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L902-L992)

## 链路断裂 vs 模型学不会

下表记录了那些**现象长得跟"学不会"一模一样、根因却是基础设施在骗它**的真实案例：

| 症状 | 真正的原因 | 修法 |
|---|---|---|
| 连着 48 轮停在 50% | 结构文档按固定条数截断（正确路径在抽取阶段被砍掉）+ 图谱过期 + critic 只说"路径不对"不给候选 | 上限提到 400；`load()` 加指纹守卫；critic 列真实候选 |
| 跑得越久越该学会，两题一直学不会 | 执行层硬截断 3 条调用，第 4 条起被**静默丢弃** + critique 读的是上一轮快照 | `_call_limit=max(3, min(8, len(rubric)))`；改读当前 `last_critique` |
| 学习曲线测出来是平线 | 坏题在库里 + critique 把失败讲成成功 + subject 里 `'?'` 无法回填 | 闸 3b/9；判据改看 verdict/coverage |
| 求助后反而更糟 | 求助把"做法"灌进去后模型直接写结论，不再取证 | 重做时只回灌做法，数值不回灌 |
| 「跑三轮就结束了」 | `rounds` 被当硬上限，面板写死 `rounds:3`，原版是 `while True` | `rounds<=0` = 不停；面板加「不停」开关 |
| 换库后连三轮一次工具都没调成功 | `os.chdir(vlml/)` + 相对路径 → 路径拼出两遍 `vlml` | 四个读取口统一按**仓库根**解析 |

**核心教训**：这些都不是"模型学不会"，是**链路断了**。区分二者的办法只有落盘验伪（`MVE_DEBUG_PROMPT=1` 看 prompt 原文）。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1505-1577](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1505-L1577), [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796)

## 与 RL 的同构对应

MVE 与强化学习的对应只是**同构分析视角**，帮熟悉 RL 的开发者快速定位组件；本项目不做强化学习训练。

| RL 概念 | MVE 对应 | 说明 |
|---|---|---|
| episode | rollout | 一次完整的出题→执行→判定 |
| horizon | 4 步 | `action_agent_task_max_retries=4` |
| policy | ActionAgent | 写 SQL 的 LLM |
| reward model | critic + 确定性闸门 | `reward` 恒 0（与原版一致），真信号在 `info["success"]` + 判词 |
| 经验复用 | 技能库 | 可检索、可组合、可重放的程序 |

## 总结

MVE 核心循环架构的核心要点可归纳为：

1. **两层调度严格同构原版**：整题层（里程碑/换题/冷却）× 子目标层（维度/重试/封顶4次），三条铁律不可违背。
2. **尺子只有一把**：学习侧不判分，消费侧判分——判分尺子不进反馈环。
3. **技能与里程碑是同一件事的两种记账**：靠文本握手，不靠 ID 路由。
4. **知识图谱是 control_primitives 的等价物**：提示打不过强先验，必须换成约束（结构/参数断言）。
5. **链路断裂 ≠ 模型学不会**：多数"学不会"的表象根因是基础设施在骗它，唯有落盘验伪可区分。
6. **习得是手段，验证是目的**：换 LLM 接入，技能库与判官都是量具，差距即真实能力。

# 学习线与消费线双线闭环

MVE 项目的核心架构是两条独立但互联的闭环线路：**学习线（练习线）**与**消费线**。学习线负责通过"拆维度 → 取证 → 判官把关 → 技能入库"的循环让 Voyager 习得技能；消费线负责在收到人的提问后，检索已有技能、编排配方、执行取证、叙事聚合，最终交付答案并更新掌握度。两条线的分立不是功能拆分，而是**设计纪律**：判分的尺子不能进入学习反馈环，否则系统学会的是"讨好裁判"而非真正掌握技能。掌握度与进步曲线**只在消费线上测量**，学习线的 critic 仅作过程控制信号（驱动闭合计数/技能入库），不作数、不能当能力证据。Sources: [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245), [HANDOFF.md:49-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L66), [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796)

## 学习线（练习线）

### 两层调度

学习线采用与原版 Voyager 同构的**两层调度**架构：

| 层 | 原版语义 | MVE 落地 |
|---|---|---|
| 整题层 | `learn()`：任务失败进 `failed_tasks`，**换题** | 里程碑：失败 → `note_milestone_round(new_closed=0)` 挂冷却 → 降级自由出题 |
| 子目标层 | `inference()`：`while sub_goals`，题内不跳过 | 维度：逐维度重试 |

Sources: [HANDOFF.md:123-155](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L123-L155), [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796)

### 三条铁律

1. **原版没有「整题总验收」层**。`inference()` 的完成判据只是"最后一条子目标成功"（`voyager_original/voyager.py:417`）。不可自行发明总验收。
2. **原版对做不出的任务从不原地无限重试**：单任务封顶 `action_agent_task_max_retries=4` → 记 failed + 换题。MVE 已封顶 4 次 + 冷却（`MAX_RETRY_STREAK = 4`）。
3. **骨架拆一次就固定，永不因失败重拆**。曾按失败指纹重拆 → 维度 id 每轮变 → 闭合账全对不上。

Sources: [HANDOFF.md:123-155](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L123-L155)

### 学习线主流程

```mermaid
sequenceDiagram
    autonumber
    participant SL as scene_learn
    participant LO as learn_orchestrate
    participant V as voyager
    participant Critic as task_critic
    participant SS as skill_store
    participant Milestone as milestone

    SL->>+LO: 启动维度循环
    loop 逐维度
        LO->>+V: 出题 + 执行
        V-->>-LO: 轨迹 + 证据
        LO->>+Critic: 判卷
        Critic-->>-LO: verdict + coverage
        alt 判对(全闭合)
            LO->>SS: add(技能, source="practice")
            LO->>Milestone: note_milestone_round(new_closed+=1)
        else 判错(部分/未闭合)
            LO->>Milestone: note_milestone_round(new_closed=0)
            LO->>LO: 生成反馈(缺哪些/为什么错)
        end
    end
    LO-->>-SL: 本轮结果
```

Sources: [mve/learn_orchestrate.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/learn_orchestrate.py), [mve/scene_learn.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/scene_learn.py), [mve/voyager.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/voyager.py)

### 学习线不判分的设计纪律

学习线的 critic 只是**过程控制信号**，驱动闭合计数和技能入库，不作为能力证据。理由：如果判分的尺子进入学习反馈环，系统学会的是"讨好裁判"——它会找到某种捷径让 critic 输出 success，而非真正掌握取证技能。消费线才是交付线，人在消费线上真的要一个答案，这时用 VLML0 裁判独立跑一遍量出覆盖率，才是真实的进步。Sources: [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245), [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236), [docs/README-学习机制详解-2026-10-13-存档.md:661-752](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L661-L752)

### 技能入库条件

只有**判对（全闭合）时才写技能库**。判错时不写——已被裁判证明是错的做法，写进去就是埋雷。这是解开死结的关键决定：

- 判错 → 不写技能库（避免埋雷）
- 判对 → 写技能库（做法已被验证）
- 入库前经 `generalize` 去数值（脱去 series_id 等具体值，保留可复用骨架）

Sources: [反馈链路与旁路学习.md:1-50](https://github.com/Zxy876/voyager-vlml-mve/blob/main/反馈链路与旁路学习.md#L1-L50), [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796)

### 消费只编排复用，不现做合成

这是 2026-10-25 拍板的边界：**学过什么答什么，没学过就明说"未学"并踢回学习线**。"未学"的反面不是"编一个答案"，是"标记 + 生成课程"。消费线检索到配方后走 `_compose_sql` 通道，把检索到的配方当材料让执行层写一条组合 SQL，配守卫 + 对题判官 + 双口径披露。Sources: [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245), [HANDOFF.md:216-281](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L216-L281)

### 数据契约

Voyager 每轮产出：**SQL + 真实行数据 + 来源工具清单 + 判卷结论**。叙事（给人看的自然语言回答）单独一层产出，且**声明不参与判分**——判分只看：取到真数没有、方法与裁判比对是否同量、字面量是否全部可指认。Sources: [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245)

### 消费线两条入口及其完整度差异

| 入口 | 接了哪几闸 | 缺什么 |
|---|---|---|
| `voyager_vlml/consume.py`（VLML 消费线） | 闸三 `has_real_data`（判有没有取到真数） | `source_binding` / 搬运判据 / `reason_demos` 全 0 |
| `mve/coach.py:528 explain`（面板聊天 + 人导入） | **一闸都没接** | 真空防线 + 来源绑定 + 搬运判据 + 示范召回，全缺 |

Sources: [HANDOFF.md:192-236](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L192-L236)

### 尺子隔离原则

```mermaid
graph TD
    subgraph 学习线
        L_Exec["执行取证"]
        L_Critic["过程控制信号"]
        L_Skill["技能入库"]
        L_Exec --> L_Critic
        L_Critic --> L_Skill
    end
    subgraph 消费线
        C_Exec["执行取证"]

## 掌握度模型

### 双机制：V2 掌握度 + 保持度

掌握度由两套独立机制共同决定：

| 机制 | 文件 | 核心逻辑 |
|---|---|---|
| V2 掌握度 | `mve/mastery_v2.py` | 基于 attempt_quality 的加权累积，含 `hint_used_modifier=0.85` 折扣 |
| 保持度（遗忘曲线） | `mve/mastery_retention.py` | 会话级半衰期衰减；`correct 且 used_hint=False` 才拉长半衰期 |

Sources: [mve/mastery_v2.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/mastery_v2.py), [mve/mastery_retention.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/mastery_retention.py), [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708)

### 会话级衰减

保持度以**会话**为单位衰减，不是按天：

- 会话划分依赖时间戳（`assign_sessions`）：相邻间隔 > `session_gap_hours`（默认 2 小时）就开新会话
- `time_decay = 2^(-会话年龄 / 半衰期会话数)`，默认 `half_life_sessions = 3`
- 同会话内连答不衰减（同一场练习互不衰减）

实测数据：

| 情形 | recency | mastery |
|---|---|---|
| 3 个会话各 2 条全对证据 | 0.8079 | 0.8419 |
| 单会话内 40 轮全对 | 1.0000 | — |

Sources: [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708)

### 借助帮助后的掌握度计算

照伴学"借助帮助后答题"的口径：

| 位置 | 规则 | 用了帮助时 |
|---|---|---|
| `mastery_v2.py:36` + `:391-396` | `hint_used_modifier = 0.85` | 得分**打 0.85 折** |
| `mastery_retention.py:46-51` | `correct 且 used_hint=False` 才拉长半衰期 | 半衰期**不动** |

即：**打折但不加速遗忘**——不是惩罚，是"不计全功"。对照实验：

| 情形 | mastery | 半衰期（3.0 起） |
|---|---|---|
| 自己答对 | 0.6057 | 3.0 → 3.588（拉长） |
| 借助帮助答对 | 0.5148 | 3.0 → 3.000（不动） |
| 答错 | — | 3.0 → 2.706（缩短） |

Sources: [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795), [知识图谱与求助闭环.md:1-156](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L1-L156)

## 反馈链路与旁路学习

### 反馈链路的诊断

`learn()` 里两处产出都是**硬编码模板**（判对 `:1048-1050`、判错 `:1120-1124`），每轮只换维度名。更关键的是死结：

- 判错时不写技能库（对的决定，错的做法写进去是埋雷）
- 学习只可能发生在判对时
- 判对时写的又是一条模板

→ 技能库长期 1 条、内容模板生成。**学习几乎没发生。** Sources: [反馈链路与旁路学习.md:1-50](https://github.com/Zxy876/voyager-vlml-mve/blob/main/反馈链路与旁路学习.md#L1-L50)

### 伴学对照：反馈是一包结构

伴学的判题反馈是结构化的一包（`tutor_llm_agent_answer_evaluate.py:96-131`）：

| 字段 | 作用 |
|---|---|
| `verdict` / `score` | 结论 |
| `error_type` | 错在哪一类 |
| `feedback` | 给学习者的话 |
| `next_action` | 下一步具体做什么 |
| `covered_points` / `missing_points` | 覆盖/缺失知识点 |
| `misconceptions` | 错误概念 |
| `step_feedback` | 逐步反馈 |
| `related_topics` | 相关知识点（图谱扩散） |
| `reference_answer` | 服务端持有的标准答案 |
| `confidence` | 判定确信度 |

Sources: [反馈链路与旁路学习.md:1-50](https://github.com/Zxy876/voyager-vlml-mve/blob/main/反馈链路与旁路学习.md#L1-L50)

### 两个通道分离

| | 考核通道（做题） | 旁路通道 |
|---|---|---|
| 给不给答案 | **不给**（覆盖率不可比） | **给**（标准解法） |
| 判不判分 | 判，进掌握度 | 不判，只进技能库 |
| 学到的东西 | 自己的做法（判对才固化） | 裁判的做法（已被验证正确） |

旁路解开死结：旁路上学的不是 Voyager 自己的做法，而是裁判的做法，可以放心固化。Sources: [反馈链路与旁路学习.md:1-50](https://github.com/Zxy876/voyager-vlml-mve/blob/main/反馈链路与旁路学习.md#L1-L50)

### 旁路学习实现

`mve/bypass_learn.py` 流程：跑 `vlml0_referee.answer(task)` → 拿裁判的 `trajectory` 与取到的维度 → LLM 提炼 `{name, lesson, defect, strategy}` → 写技能库（`source="bypass"`）。

蓝图结构：

```json
{"defect": "missing_dimension", "strategy": "drill_down",
 "trajectory": ["match_summary_report", "pattern_detection_report"],
 "dimensions": ["pistol_win_rate", "eco_win_rate", ...], "source": "bypass"}
```

`defect` 四类：`missing_dimension` / `wrong_granularity` / `tool_uncovered` / `value_form`；`strategy` 四类：`drill_down` / `switch_tool` / `combine_tools` / `read_scope`。Sources: [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708), [反馈链路与旁路学习.md:1-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/反馈链路与旁路学习.md#L1-L177)

### 关键教训：注入形态决定行为

第一版只把 lesson 文本注入 prompt，轨迹仍是单步 → 覆盖率没提升。**给"做法描述"没用，给"编排序列"才有用。** 补上 `_blueprint_hint(skill)` 后重跑，轨迹变成两步——行为真的改了。Sources: [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708), [反馈链路与旁路学习.md:1-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/反馈链路与旁路学习.md#L1-L177)

## 求助闭环

### 闭环流程

```mermaid
sequenceDiagram
    autonumber
    participant V as Voyager
    participant Critic as 判官
    participant FB as feedback
    participant Decide as decide_help
    participant Bypass as VLML0解释
    participant Mastery as mastery

    V->>+Critic: 作答
    Critic-->>-V: 判定结果
    V->>+FB: 生成粗粒度反馈
    FB-->>-V: 缺哪些/没覆盖哪些/为什么答错
    V->>+Decide: 要不要求助?
    alt 有"点名但没试过"的工具
        Decide-->>-V: 不求助,先自己试(硬规则)
    else 都试过仍不行
        Decide-->>-V: 去旁路看解释
        V->>+Bypass: 跑VLML0解释链路
        Bypass-->>-V: 做法(不给数值)
        V->>V: 带解释重做本题
        V->>+Mastery: 掌握度重算(used_hint=True)
        Mastery-->>-Mastery: 打0.85折+半衰期不动
    end
```

Sources: [知识图谱与求助闭环.md:1-156](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L1-L156)

### "先自己试"是硬规则

求助一次就要在掌握度上记一笔（0.85 折）。纪律是**先自己试**：反馈里已经说了该调哪个工具（图谱给的）→ 照着调一次；调了还取不到 → 才值得花一次解释。实测把"先自己试"交给模型自由发挥，它说"我已经尝试了所有点名的工具"（其实一个都没试），所以 `decide_help()` 里先做规则判断。Sources: [知识图谱与求助闭环.md:1-156](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L1-L156)

### 解释只带回做法，不给数值

给数值等于泄题——下一轮直接照抄，覆盖率会涨但掌握度就假了。这与伴学坚持"标准答案由服务端持有、绝不用模型生成的参考答案替换"是同一条纪律。Sources: [知识图谱与求助闭环.md:1-156](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L1-L156)

## 知识图谱在双线中的角色

### 图谱回答的核心问题

| 线路 | 图谱回答的问题 |
|---|---|
| 学习线（反馈） | "eco_win_rate 由谁产出、我没调它" |
| 消费线（检索） | "这个维度该调哪个工具" |
| 求助闭环 | "有'点名但没试过'的工具" |

图谱把反馈从"你缺 eco_win_rate"（事后反推）升级为"eco_win_rate 由 pattern_detection_report 产出（图谱声明），我这次没调这个工具"（事前可查）。Sources: [知识图谱与求助闭环.md:1-156](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L1-L156)

### 图谱三层节点与五类边

```
table:rounds ──derived_from──> dim:map_rounds
tool:pattern_detection_report ──produced_by──> dim:eco_win_rate
dim:pistol_win_rate ──confusable── dim:eco_win_rate
dim:pistol_win_rate ──co_occurs── dim:pattern_rounds
tool:match_summary_report ──procedure_step──> tool:pattern_detection_report
```

Sources: [知识图谱与求助闭环.md:1-156](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L1-L156)

### 图谱作为 control_primitives 的等价物

A/B 实测（corrode_collapse，第 1 轮，不求助）：

| | A：无图谱 | B：图谱只作提示 | D：图谱+结构/参数硬断言 |
|---|---|---|---|
| 首血转换率 | 0.0 | 25.0 ✓ | 25.0 ✓ |
| 连败 SQL | 列都错了 | 骨架对，但过滤位置错 | 完全正确 |
| 连败值/起点 | 5/2 | 13/1 | **8/7 ✓** |
| 覆盖率 | 0% wrong | 20% partial | **100% correct** |

**提示打不过强先验，得换成约束。** B 组把完整骨架写进 prompt，模型五次实跑一字不改；加上 SQL 结构断言后一次就改对了。Sources: [进度对照.md:902-992](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L902-L992)

## 面板与双线可视化

### 驾驶舱设计

驾驶舱只剩**开始/停止**，不需要选难度/选题的键钮。练习范围由人在知识图谱页点知识点设定，出题器只在范围里出题。Sources: [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795), [mve/dashboard.py:562-588](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/dashboard.py#L562-L588)

### 学习曲线只在消费侧

面板的学习曲线**只认消费侧**数据。练习线的 run_log 里覆盖率恒为 None（练习不判分），画出来没有意义。消费才是交付——人真的要一个答案，这时用 VLML0 裁判独立跑一遍量出覆盖率，才是真实的进步。Sources: [mve/dashboard.py:1050-1104](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/dashboard.py#L1050-L1104)

| 限制 | 说明 |
|---|---|
| 技能绑死题目，不迁移 | 存下来的调用序列写死了 series_id/地图名，迁移考核 0% |

Sources: [HANDOFF.md:216-281](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L216-L281), [docs/README-学习机制详解-2026-10-13-存档.md:1505-1577](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1505-L1577)

## 总结

学习线与消费线双线闭环是 MVE 项目的架构核心。学习线通过"里程碑拆维度 → 逐维度练习 → 判官把关 → 技能入库"让 Voyager 习得可复用的取数配方；消费线通过"检索技能库 → 多技能编排 → 执行取证 → 叙事聚合 → 裁判复核 → 掌握度记账"交付答案并量化真实进步。两条线共享技能库与执行层，但判据层严格隔离——尺子不进反馈环是贯穿全文的设计纪律。旁路学习与求助闭环为学习线补充了"看标准解法"的通道，知识图谱为双线提供事前可查的先验知识，将反馈从事后反推升级为事前指引。掌握度只在消费线上测量，借助帮助后按伴学口径打折但不加速遗忘，确保掌握度反映的是真实能力而非幻觉。

# 双 MCP 架构与工具边界

## 概述

MVE 系统采用**双 MCP（Model Context Protocol）架构**，将外部工具能力分为两条独立的 MCP 通道：**VLML MCP**（数据查询通道，连接 Valorant 数据库工具集）和 **Neko MCP**（通用工具通道，提供网页搜索等外部能力）。这种分离确保了数据取证的隔离性与安全性——学习线只能通过 VLML MCP 访问受控的数据库工具，而消费线的扩展能力则通过 Neko MCP 按需接入。

工具边界是双 MCP 架构的核心约束：每个 MCP server 通过 `mcp_servers.json` 配置白名单/黑名单控制工具暴露，子进程环境变量按最小权限原则过滤，DuckDB 外部文件访问被禁用。这套边界确保 agent 的执行域不会越权读取密钥、源码或任意文件。

Sources: [README.md:1-69](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L69), [部署.md:227-322](https://github.com/Zxy876/voyager-vlml-mve/blob/main/部署.md#L227-L322), [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

## 两条 MCP 通道

### VLML MCP 通道（数据取证）

VLML MCP 是 MVE 的**主数据通道**，提供 10 个 MCP 工具直连 Valorant 数据库（`query_sql`、各类报告工具等）。学习线的全部取证必须经过此通道，确保数据来源可审计、可复现。

| 组件 | 职责 |
|---|---|
| `voyager_vlml/env/vlml_mcp.py` | VLML MCP 客户端，封装工具调用协议 |
| `vlml_bridge/vlml_mcp.py` | MCP 桥接层，协议转换 |
| `vlml_bridge/vlml_http_bridge.py` | HTTP 桥接，支持远程 VLML 服务 |
| `neko_voyager/voyager_plugin/vlml_bridge_client.py` | Neko 侧 VLML 桥接客户端 |

VLML MCP 的工具清单照搬 `server.py` 的 docstring（`TOOL_CATALOG`），包含：

- `query_sql`：直接 SQL 查询
- `match_summary_report` / `match_rounds_report`：比赛聚合报告
- `pattern_detection_report`：模式识别报告
- `player_profile_report`：选手画像
- 其他 6 个报告类工具

Sources: [voyager_vlml/env/vlml_mcp.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/voyager_vlml/env/vlml_mcp.py), [vlml_bridge/vlml_mcp.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/vlml_bridge/vlml_mcp.py), [vlml_bridge/vlml_http_bridge.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/vlml_bridge/vlml_http_bridge.py), [neko_voyager/voyager_plugin/vlml_bridge_client.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/neko_voyager/voyager_plugin/vlml_bridge_client.py)

### Neko MCP 通道（扩展工具）

Neko MCP 提供**非数据取证类**的扩展能力，主要是网页搜索（`mcp_neko_web_search`）等工具。此通道在消费线中使用，为"库外时变"问题提供联网取资料能力，但产出标记为 `claim`（工具线声明），**不入库、不计入学习曲线**。

### 两通道的职责边界

| 维度 | VLML MCP | Neko MCP |
|---|---|---|
| 用途 | 数据库取证（学习线 + 消费线复用） | 联网扩展（仅消费线） |

## 网关层：连接生命周期管理

### 核心组件 `mcp_gateway.py`

网关层负责 MCP 连接的建立、复用、健康检测和重连。关键机制：

1. **连接绑定事件循环**：每个 MCP 连接记录创建时的 `asyncio` 事件循环（`MCPClient.loop`），防止跨循环调用导致超时。
2. **存活检测**：`connected_servers(loop)` 只返回绑定当前循环的连接；`stale_servers(loop)` 识别死连接。
3. **自动重连**：`ensure_mcp_tools` 发现死连接后调用 `disconnect_all()` 整批重连。

```mermaid
sequenceDiagram
    participant Caller as 调用方
    participant GW as mcp_gateway
    participant Loop as EventLoop
    participant Server as MCP Server

    Caller->>+GW: ensure_mcp_tools()
    GW->>GW: connected_servers(current_loop)
    alt 连接存活
        GW-->>-Caller: 返回可用工具
    else 连接过期
        GW->>GW: stale_servers(current_loop)
        GW->>Server: disconnect_all()
        Server-->>GW: 已断开
        GW->>+Server: 重新连接
        Server-->>-GW: 新连接就绪
        GW-->>Caller: 返回可用工具
    end
```

Sources: [mve/mcp_gateway.py](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/mcp_gateway.py), [docs/泛化改造与测试证据-2026-10-21.md](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/泛化改造与测试证据-2026-10-21.md)

### 事件循环绑定问题（已修复）

**根因**：stdio MCP 的 transport / `_read_loop` 绑在连接时的那个循环上；面板每次导入 `asyncio.run()` 起新循环，网关却是进程级单例 → 第二次导入起，`connected_servers()` 非空 → 跳过重连 → 把调用桥到已关闭的旧循环。

**修复**（`fc41f7b`）：
- `MCPClient.loop` 记录连接时循环
- `connected_servers(loop)` 只算绑当前循环的连接
- `stale_servers(loop)` + `ensure_mcp_tools` 发现死连接就 `disconnect_all()` 整批重连

Sources: [docs/泛化改造与测试证据-2026-10-21.md](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/泛化改造与测试证据-2026-10-21.md)

### 技能重放与事件循环

技能重放时，`_run_restricted` 在 worker 线程里重建命名空间，`_ns_base` 不传 loop 时 `get_running_loop()` 抛错被吞 → MCP 工具一个都没注入。

**修复**（`776e045`）：`solve` 捕获 `get_running_loop()`，经 `_build_skill_fns → _make_skill_fn → _ns_base(loop=…)` 一路下传到 worker 线程。

Sources: [docs/泛化改造与测试证据-2026-10-21.md](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/泛化改造与测试证据-2026-10-21.md)

## 配置层：`mcp_servers.json`

每个 MCP server 在 `mcp_servers.json` 中配置，核心字段：

| 字段 | 类型 | 说明 |
|---|---|---|
| `command` | string | 启动 server 的命令 |
| `args` | string[] | 命令参数 |
| `env` | object | 传递给子进程的环境变量（显式声明） |
| `expose` | string[] | 工具白名单（只暴露这些工具） |
| `deny` | string[] | 工具黑名单（屏蔽这些工具） |

### 工具准入控制

```
expose 和 deny 都不配 → 全放行
配了 expose → 只暴露白名单中的工具
配了 deny → 屏蔽黑名单中的工具
运行期连续失败 ≥2 次的工具 → 自动从 prompt 菜单摘掉
```

Sources: [mve/mcp_servers.json](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/mcp_servers.json), [部署.md:227-322](https://github.com/Zxy876/voyager-vlml-mve/blob/main/部署.md#L227-L322)

### 子进程环境变量

MCP server 子进程环境按**最小权限**过滤：

- **白名单**：`PATH` / `HOME` / `LANG` / 代理相关变量
- **显式声明**：配置里 `env` 字段指定的变量
- **全继承**：`MVE_MCP_ENV_PASSTHROUGH=1` 时临时全继承（调试用）

> ⚠️ server 缺 key 就在 `mcp_servers.json` 的 `env` 里写；不要通过全继承绕过安全约束。

Sources: [部署.md:227-322](https://github.com/Zxy876/voyager-vlml-mve/blob/main/部署.md#L227-L322)

## 持久服务层：`mcp_services.sh`

常驻 MCP server 由 `mve/mcp_services.sh` 拉起，作为系统级守护进程运行。这些服务在面板启动前就已就绪，确保学习循环和消费线的工具调用不需要冷启动等待。

```mermaid
graph TD
    BOOT[系统启动] --> SH[mcp_services.sh]
    SH --> VLML_S[VLML MCP Server]
    SH --> NEKO_S[Neko MCP Server]
    SH --> OTHER_S[其他常驻 Server]

    VLML_S --> GW[网关注册]
    NEKO_S --> GW
    OTHER_S --> GW

    GW --> PANEL[面板进程]
```

Sources: [mve/mcp_services.sh](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/mcp_services.sh)

## 工具边界：最小权限原则

### 执行层边界总表

| 项 | 现状 | 放宽方式 |
|---|---|---|
| 可读根 | **只有场景目录** | 放进场景目录；或 `MVE_READ_ROOTS=/a:/b` 点名授权 |
| 应用工作区 | **不可读**（学习循环读不到自己的源码） | 同上，别把 `/root/mve` 加回默认根 |
| 密钥类文件 | 永远拒（`.env`/私钥/证书/`.netrc`/`.pgpass`/凭据 json） | 不该放宽 |
| DuckDB 外部文件 | `SET enable_external_access=false` | 不该放宽 |
| MCP 子进程环境 | 白名单 + 显式声明 | `MVE_MCP_ENV_PASSTHROUGH=1` |
| MCP 工具准入 | `expose`/`deny` 配置 | 配了就按配置走 |
| 执行路径 | 按环境形态分流 | `MVE_CODE_EXEC=0` 全退回 SQL；`=all` 连 vlml 也走代码 |

Sources: [部署.md:227-322](https://github.com/Zxy876/voyager-vlml-mve/blob/main/部署.md#L227-L322)

### MCP 挂进工具的边界

> **MCP 挂进来的工具是另一层**：本仓库管得到「协议形状」「子进程环境」「让它挂哪几个工具」，**管不到**「工具被调用后 server 内部读什么」—— 那在各自 server 的代码里。要收窄只能不暴露那个工具，或换 server。

Sources: [部署.md:227-322](https://github.com/Zxy876/voyager-vlml-mve/blob/main/部署.md#L227-L322)

### 执行环境形态分流

```mermaid
graph TD
    REQ[工具调用请求] --> CHECK{环境形态?}
    CHECK -->|kind=local/scene| CODE[代码执行路径]
    CHECK -->|kind=vlml| SQL[SQL 执行器]
    CHECK -->|MVE_CODE_EXEC=all| CODE2[全部走代码]

    CODE --> EXEC[local_agent.py]
    SQL --> VLML[vlml_env.py]
```

Sources: [部署.md:227-322](https://github.com/Zxy876/voyager-vlml-mve/blob/main/部署.md#L227-L322), [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123)

## 消费侧 MCP 集成：OpenAI 兼容接口

MVE 的学习能力被包装成 **OpenAI 兼容的 model**，任何认这套协议的客户端都能接。消费侧的 MCP 工具调用通过此接口暴露：

| 项 | 值 |

| Base URL | `https://43.161.203.50:8443/mve/v1` |

## 总结

双 MCP 架构通过将数据取证（VLML MCP）与扩展能力（Neko MCP）分离，实现了学习线与消费线的工具隔离。网关层（`mcp_gateway.py`）管理连接生命周期，解决事件循环绑定问题；配置层（`mcp_servers.json`）通过 `expose`/`deny` 实现工具准入控制；持久服务层（`mcp_services.sh`）确保常驻服务就绪。工具边界从可读根、密钥文件、DuckDB 外部访问、子进程环境、工具暴露五个维度实施最小权限原则，确保 agent 执行域不会越权。这套架构的核心设计原则是：**仓库管得到协议形状和工具暴露，管不到 server 内部行为——收窄只能不暴露或换 server**。

# 技能库与经验结晶机制

技能库与经验结晶机制是 Voyager-VLML-MVE 框架的核心学习基础设施。与传统的模型权重更新不同，本系统通过**在线技能习得**实现学习：环境反馈不回传梯度，而是回传判卷结论；经验结晶成**可检索、可组合、可重放**的程序（SQL 配方或 Python 脚本），存入技能库替代参数更新。技能库回答"会了什么"，里程碑回答"学到哪了"，两者靠文本握手而非 ID 路由——这与原版 Voyager 的 `skill_manager.add_new_skill` + `curriculum_agent.update_exploration_progress` 同构。

Sources: [README.md:1-69](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L69), [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796)

---

## 整体架构

技能库系统由四个核心子系统组成：存储与检索、结晶与入库、泛化与回填、审计与修复。下图展示它们在主循环中的位置与数据流：

```mermaid
graph TD
    A["课程出题"] --> B["Rollout 执行"]
    B --> C["Critic 判卷"]
    C -->|success=True| D["结晶：learn_milestone_skills"]
    C -->|success=False| E["记缺口，不写库"]
    D --> F["generalize 泛化"]
    F --> G["skill_store.add 入库"]
    G --> H["向量索引更新"]
    
    I["消费侧检索"] --> J["skill_store.retrieve"]
    J --> K["_refill_sql 回填"]
    K --> L["执行取数"]
    
    M["旁路学习"] --> N["VLML0 解释"]
    N --> O["提炼 blueprint"]
    O --> G
    
    P["技能审计"] --> Q["audit_skill_replay"]
    Q --> R["repair_skill_keys"]
    R --> G
```

Sources: [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245), [docs/README-学习机制详解-2026-10-13-存档.md:728-834](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L728-L834), [HANDOFF.md:150-201](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L150-L201)

## 技能存储与检索

### 存储结构

技能库的核心是 `skill_store.py`，每条技能包含以下字段：

| 字段 | 类型 | 说明 |
|---|---|---|
| `code` | str | 解法源码（SQL 配方或 Python 脚本） |
| `text` | str | 一句话方法描述（带题面，检索键更实） |
| `topic` | str | 归属维度/主题 |
| `source` | str | 来源：`practice` / `bypass` / `consume` |
| `blueprint` | dict | 蓝图：含 `trajectory`、`defect`、`strategy` |
| `scene` | str | 场景隔离标识 |

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

### 入库逻辑：add() 方法

`skill_store.add()` 实现三路分支，对应原版 Voyager 的同名 Rewriting 机制：

```mermaid
graph TD
    A["add(skill)"] --> B{"相似度 ≥ 0.90?"}
    B -->|是| C["skipped：丢弃"]
    B -->|否| D{"与已有技能相似度 ≥ DUP_THRESHOLD?"}
    D -->|是| E["rewritten：覆盖旧条目"]
    D -->|否| F{"字数 < 12?"}
    F -->|是| G["skipped：无用技能"]
    F -->|否| H["added：新增条目"]
```

关键阈值与规则：

| 规则 | 阈值 | 原版对照 |
|---|---|---|
| 无用技能丢弃 | 字数 < 12 | 原版 "Deposit useless items" |
| 高相似度去重 | ≥ 0.90 | 原版同名 Rewriting（`skill.py:74-76`） |
| 重复覆盖 | `DUP_THRESHOLD=0.62` | 原版 `dict[program_name]` 同名覆盖 |
| 检索上限 | `top_k=5` | 原版 `retrieval_top_k=5` |

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177), [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796)

### 检索逻辑：retrieve() 方法

检索采用**词面 Jaccard 相似度 + topic 预过滤**的两阶段策略：

```mermaid
sequenceDiagram
    participant C as 消费侧/学习侧
    participant S as skill_store
    participant V as 向量索引

    C->>S: retrieve(topic, question, top_k=5)
    S->>S: 按 topic 预过滤候选集
    S->>V: similarity_search(question, k=top_k)
    V-->>S: 候选技能列表
    S->>S: Jaccard 相似度排序
    S-->>C: 技能列表（含 code + text + blueprint）
```

**topic 只做预过滤不当路由**——这是刻意设计，防止"尺子拿错"（不同维度但同表同列的技能应可跨题复用）。跨题检索需过 `CROSS_TOPIC_MIN_SIM=0.12` 门槛。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796), [docs/外部task闭环.md:172-257](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/外部task闭环.md#L172-L257)

### 膨胀监控

`skill_store.stats()` 提供膨胀率指标：

```
bloat = 累计写入次数 / 实际条目数
```

实测数据：改前 15 次写入 → 15 条（bloat=1.0，一次都没挡住）；改后 3 次写入 → 2 条（bloat=1.5）。

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

## 经验结晶：成功才写库

### 核心铁律

**只有 success=True 的 rollout 才结晶进技能库**——这是从原版 Voyager 直接搬来的设计铁律：

> 原版 `voyager.py:369-372`：
> ```python
> if info["success"]:
>     self.skill_manager.add_new_skill(info)      # 解法进技能库
> self.curriculum_agent.update_exploration_progress(info)   # 任务文本进里程碑
> ```

判错时**不写技能库**的原因：这次的做法已被裁判证明是错的，写进去就是往库里埋雷。实测反例：`pistol_eco_pattern` 攒下错经验后，后续轮次一直被带偏，覆盖率从 80% 掉到 45%。

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:1728-1796](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1728-L1796), [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

### 结晶出口的唯一性

判据对齐链路：

```
maieutic_gate 判 open 为空 → spec 闭合
  → task_critic 返回 success=True
  → ok1 → learned_dims
  → learn_milestone_skills → 写库（唯一出口）
```

**落库出口只能有一个**（P5 约束），不能另加 `finalize`。判错靠 critique 在本题内重做时回灌；跨运行靠 `run_log` 持久化的缺口维度。**缺口会留，做法不留。**

Sources: [docs/建模表与技能落库-可行性.md:77-165](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/建模表与技能落库-可行性.md#L77-L165)

### 三条写入通道

| 通道 | 写入端 | code 内容 | kind |
|---|---|---|---|
| 学习侧 | `learn_milestone_skills` | Python 脚本（`RESULT=…`） | `py` |
| 消费侧 | `_absorb` | 纯 SQL | `sql` |
| 旁路侧 | `bypass_learn` | SQL 配方 + blueprint | `sql` |

三通道一个口径——**都过 generalize**。`_absorb` 返回的是 `skill_key`，不是 code 字符串。

Sources: [HANDOFF.md:150-201](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L150-L201), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

## 技能泛化与回填

### 泛化机制：存算法不存数值

入库前 `generalize` 将具体值替换为 `:slot` 占位符，消费侧 `_refill_sql` 回填真实值。这是技能可复用的前提：

```mermaid
graph TD
    A["原始 SQL：WHERE series_id='123'"] --> B["generalize"]
    B --> C["泛化 SQL：WHERE series_id=:slot"]
    C --> D["skill_store.add 入库"]
    D --> E["skill_store.retrieve 检索"]
    E --> F["_refill_sql 回填"]
    F --> G["执行 SQL：WHERE series_id='456'"]
```

**换值回测**（未实现）：技能入库后用 `:slot` 换真实实体值经 `_refill_sql` 重放 1~2 次 → 标记 `verified` / `unverified-variant`。对照论文 2010.02840 的 neighbor queries，但**不做随机库 fuzzing**（没有 gold SQL）。

Sources: [HANDOFF.md:150-201](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L150-L201), [HANDOFF.md:216-281](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L216-L281)

### 回填与组合编排

消费侧的 `_refill_sql` 从检索到的配方回填 `:slot`，支持多技能整批编排：

```
每条配方 → 回填 :slot（值必须逐字来自实查清单）
  → 字面量守卫 / fan-out 闸 逐条拦 → 逐条执行取真数
→ 数据行标「来源技能」→ 叙事层聚合（来源编号逐个披露）
→ critic + 裁判独立复核 → 掌握度记账
```

**消费只编排复用，不现做合成**——学过什么答什么，没学过明说"未学"并踢回学习线。

Sources: [README.md:176-245](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L176-L245)

## 技能注入与蓝图提示

### 为什么必须给源码

原版 Voyager 的 `render_system_message()` 把 **control_primitives 的源码**拼进 system message——模型看到的是每个函数**怎么实现的**，不只是函数名。MVE 同构：

| 注入方式 | 函数 | 作用 |
|---|---|---|
| 解法源码 | `_code_block()` | 给出完整 SQL/Python，模型知道该照着写什么 |
| 蓝图编排 | `_blueprint_hint()` | 给出标准编排序列 + 策略 |
| 知识图谱子图 | `GRAPH_STATE` | 常驻上下文，像 control_primitives |

实测教训：只给一句自然语言经验（"按什么维度拆分"），模型**读了但不改行为**——注入 2 条经验，轨迹仍是单工具、覆盖率掉到 30%。给编排序列后重跑，轨迹从 `['match_summary_report']` 变成 `['match_summary_report', 'pattern_detection_report']`——**行为真的改了**。

Sources: [mve/voyager.py:758-828](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/voyager.py#L758-L828), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

### 蓝图提示的实现

```python
def _blueprint_hint(skill: dict[str, Any]) -> str:
    bp = skill.get("blueprint") or {}
    traj = [str(t) for t in (bp.get("trajectory") or [])
            if not str(t).startswith("<")]
    if not traj:
        return ""
    hint = f"｜标准编排：{' → '.join(traj)}"
    if bp.get("strategy"):
        hint += f"（策略：{bp['strategy']}）"
    return hint
```

蓝图包含四类缺陷诊断和四类修复策略：

| 缺陷类型 (`defect`) | 修复策略 (`strategy`) |
|---|---|
| `missing_dimension` | `drill_down` |
| `wrong_granularity` | `switch_tool` |
| `tool_uncovered` | `combine_tools` |
| `value_form` | `read_scope` |

Sources: [mve/voyager.py:758-828](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/voyager.py#L758-L828), [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708)

## 旁路学习

旁路学习是独立于做题的第二条学习通道：跑 VLML0 解释链路获取标准轨迹，提炼后写入技能库。

```mermaid
sequenceDiagram
    participant V as Voyager
    participant R as VLML0 Referee
    participant L as LLM
    participant S as skill_store

    V->>R: answer(question)
    R-->>V: 标准轨迹（工具调用序列 + 结果）
    V->>L: 提炼 {name, lesson, defect, strategy}
    L-->>V: blueprint
    V->>S: add(source="bypass", blueprint=blueprint)
    S-->>V: skill_key
```

关键约束：**只带回做法不给数值**——给数值=泄题，掌握度会假。旁路技能带 `source="bypass"` 标记，与练习线技能区分。

Sources: [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

## 防幻觉与事实溯源

### 事实溯源：_ground_facts()

prompt 里写"不要编造数字"是软约束，拦不住。`_ground_facts()` 实现硬校验：

| 情形 | 处理 |
|---|---|
| 数值在工具返回里出现 | 保留 |
| 数值可由返回中两个数字算出（如 13/21→61.9） | 保留 |
| 数值不在返回中且不可推导 | 🛑 拦下，记进 `hallucinations` |
| 工具全失败 | 数值型事实一律不保留 |

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

### 回灌防幻觉

| 原版做法 | MVE 落点 |
|---|---|
| 回灌**代码全文**，不是函数名 | `_note_attempt()` 记下含失败调用的 SQL 原文并回灌 |
| 缺失项显式写 `No code / No error / None` | `_render_observation()` 四项全部显式写 None |
| 解析失败 retry=3 + 严格断言 | `_validate_plan()` 工具名白名单 + 重试 3 次 |
| 事件里出现 `onError` 直接判失败 | 工具全挂 → 跳过抽取，不让它对着错误编数字 |

实测：原来只回灌工具名，模型连犯三轮同一个 `team_name` 错；改成回灌 SQL 原文 + 表结构探测后，覆盖率轨迹 `60% → 100% → 100%`。

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

## 知识图谱作为 control_primitives 等价物

### 设计原理

原版 Voyager 能写出能跑的 JS，不是因为模型会 Mineflayer，而是 `render_system_message()` 把 control_primitives 的源码拼进了 system message。MVE 的同构物是**本题相关子图**：

```mermaid
graph TD
    A["知识图谱"] --> B["维度节点"]
    A --> C["工具节点"]
    A --> D["表节点"]
    B -->|"produced_by"| C
    C -->|"derived_from"| D
    B -->|"confusable"| B
    B -->|"co_occurs"| B
    C -->|"procedure_step"| C
```

图谱提供的信息：

| 信息 | 作用 |
|---|---|
| `semantics`：指标怎么算 | 防止模型把 `fb_conv` 当列名 |
| `recipe`：复杂指标脱敏骨架 | gaps-and-islands 等结构 |
| `columns_by_table`：每张表实际用到哪些列 | 防止同名列张冠李戴 |
| `typical_errors`：典型错法 | 按致命程度排序，最致命排第一 |
| `value_columns`：取结果第几列 | 多评分点共用同 SQL 时必填 |

**泄题边界**：SQL 里所有字符串字面量一律抹成 `'?'`——给口径、给结构，不给答案。

Sources: [知识图谱与求助闭环.md:185-298](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L185-L298), [mve/voyager.py:758-828](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/voyager.py#L758-L828)

### A/B 实测证据

同一道题 `corrode_collapse`，第 1 轮，`--help-policy=never`：

| 条件 | 首血转换率 | 连败 SQL | 连败值/起点 | 覆盖率 |
|---|---|---|---|---|
| A：无图谱 | 0.0 | 列都错了 | 5/2 | 0% wrong |
| B：图谱只作提示 | 25.0 ✓ | 骨架对，过滤位置错 | 13/1 | 20% partial |
| D：图谱+结构/参数断言 | 25.0 ✓ | 完全正确 | 8/7 ✓ | 100% correct |

**提示打不过强先验，得换成约束。** B 组把完整骨架写进 prompt，模型五次实跑一字不改；加 SQL 结构断言后一次就改对了。

Sources: [知识图谱与求助闭环.md:185-298](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L185-L298), [进度对照.md:902-992](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L902-L992)

### 开关与 A/B 控制

| 环境变量 | 作用 |
|---|---|
| `MVE_GRAPH=0` | 关闭图谱注入，回到无 control_primitives 基线 |
| `MVE_GRAPH_RECIPE=0` | 关闭 SQL 骨架注入 |
| `MVE_DEBUG_PROMPT=1` | 落完整规划 prompt 到 `/tmp/mve_plan_prompt.txt` |

图谱是**常驻**上下文，不计入 `used_hint`、不打掌握度折扣；求助（VLML0 解释）才是伴学意义上的"借助帮助"，要打 0.85 折。两者不能混。

Sources: [mve/voyager.py:758-828](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/voyager.py#L758-L828)

## 已知问题与演进方向

### code 字段双语言问题

当前 `skill_store` 的 `code` 字段被两个写入端塞了两种语言：

| 写入端 | 写什么 | 读取端期望 |
|---|---|---|
| `_absorb`（消费侧） | 纯 SQL | `_refill_sql` 当 SQL |
| `learn_milestone_skills`（学习侧） | Python 脚本 | `_make_skill_fn` 当 Python `exec()` |

**没有 `kind` 判别**——场景 A 消费侧沉出来的纯 SQL，到学习侧会被当 Python 重放（必炸）。解决方案是落库到 db 时加 `kind` 列区分。

Sources: [docs/建模表与技能落库-可行性.md:1-99](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/建模表与技能落库-可行性.md#L1-L99)

### 提议的 db 落库方案

```sql
problem(problem_id PK, scene, question, topic_id, dim_id, import_id, created_at)
plan_ref(plan_id PK, problem_id, table_name, column_name, role, note)
recipe(recipe_id PK, problem_id, kind, sql, py,
       depends_on, verified_rows, verified_by, verified_at, superseded_by)
```

三列关键：`kind` 治双语言问题；`depends_on` 保组合关系；`superseded_by` 解旧账覆盖问题。

Sources: [docs/建模表与技能落库-可行性.md:77-165](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/建模表与技能落库-可行性.md#L77-L165)

### 其他已知限制

| 限制 | 说明 |
|---|---|
| 技能绑死题目，不迁移 | 存下来的调用序列写死了 `series_id` / 地图名，迁移考核 0%（原版 Voyager 同） |
| 旧后端条目混存 | 早期存的是编排代码（`async def xxx_solve(mcp)`），不是 SQL 配方 |
| 掌握度挂在 `topic_id` | 设计要按组合类算，代码目前按题聚合 |
| 换值回测未实现 | 全仓 grep `unverified-variant\|换值` 零命中 |

Sources: [HANDOFF.md:150-201](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L150-L201), [HANDOFF.md:216-281](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L216-L281), [docs/README-学习机制详解-2026-10-13-存档.md:1505-1577](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1505-L1577)

| 原版（行号） | MVE 落地 | 差异与理由 |

技能库与经验结晶机制是 MVE 框架实现"不训练模型也能学习"的核心基础设施。它通过严格的"成功才写库"铁律、泛化-回填的参数化机制、知识图谱作为 control_primitives 等价物的注入策略，以及旁路学习的双通道设计，确保技能库中的每一条经验都是**可验证、可复用、可审计**的真技能，而非模型幻觉的产物。防膨胀与防幻觉机制（去重、事实溯源、回灌原始观察）则保证库不会随运行膨胀腐化。当前最突出的结构性问题是 `code` 字段的双语言混存，提议的 db 落库方案（`problem` / `plan_ref` / `recipe` 三表 + `kind` 列）是已识别的演进方向。

# 防幻觉三闸与判卷体系

MVE 框架的核心设计原则是**习得是手段，验证是目的**。框架不训练模型、不改权重，而是让 agent 在真实数据库环境中自己出题、取数、被判卷，把跑通的做法结晶成技能。在这一闭环中，最关键的风险是**幻觉**——模型编造数字、张冠李戴、把空结果当有效数据。防幻觉三闸与判卷体系正是为消除这一风险而设计的多层防线，确保"学到的技能是真技能，不是猜的"。

该体系由三道闸门（真空防线、来源绑定、事实溯源）、两层判卷（学习侧过程控制 vs 消费侧能力验证）、以及知识图谱注入组成，形成从环境观察到最终判定的完整证据链。其设计直接对照 Voyager 原版的 `critic.check_task_success` 布尔自验证机制，并参照 LLM-as-a-Judge（2306.05685）与 Text-to-SQL Test Suites（2010.02840）两篇论文的防误判策略。

Sources: [README.md:1-69](https://github.com/Zxy876/voyager-vlml-mve/blob/main/README.md#L1-L69), [HANDOFF.md:103-167](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L103-L167), [docs/判官与技能真实性验证_会议纪要与论文对照.md:1-77](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/判官与技能真实性验证_会议纪要与论文对照.md#L1-L77)

## 体系总览：三层防线架构

防幻觉体系遵循一条不可逆的证据链：

```mermaid
graph TD
    A["环境真实观察面"] --> B["LLM 判官<br/>（看材料账，不看自述）"]
    B --> C["确定性守卫<br/>（硬闸门）"]
    C --> D{"技能入库？"}
    D -->|"三闸全过"| E["写入技能库"]
    D -->|"任一闸拦"| F["丢弃 + 记 hallucinations"]

    style A fill:#e1f5fe
    style C fill:#ffcdd2
    style E fill:#c8e6c9
    style F fill:#ffcdd2
```

**核心原则**：环境观察三方共用（出题器 / QA 层 / critic），必须是**同一份**。判官的 `quotes` 逐字核对；"无法判断 + gap"不算答到。判词要**可执行**：语义层的 `gap` 必须拼进 `crit1`（缺哪份材料 + 怎么取），否则下一轮拿着"没有指认任何引文"原地重撞。

Sources: [HANDOFF.md:103-130](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L103-L130)

## 防幻觉三闸详解

### 闸一：真空防线（has_real_data）

检测模型是否**真正取到了数据**，而非对着空结果编造结论。

| 检测项 | 判据 | 代码落点 |
|---|---|---|
| SQL 查询返回空 | `rows=0` 或全 `NULL` | `consume.py:2419/2462/2575/3049` |
| 空表聚合 | `(NULL, 0)` 会骗过判据 | `is_vacuous()` 判定 |
| 正文类工具取回空 | 非空正文 ≥20 字 = 真取到 | `_material_real()` |
| 布尔列误判 | `bool` 是 `int` 子类，别用 `isinstance(x, int)` | 类型检查 |

**关键陷阱**：`bool` 是 `int` 的子类，用 `isinstance(x, int)` 判数值会把布尔值混入。`needs_data(q, has_env=False)` 必须传第二参，单参恒 False = 真空防线直接失效。

Sources: [HANDOFF.md:131-145](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L131-L145), [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

### 闸二：来源绑定（source_binding）

数值必须在工具返回里**真的出现过**，或能由返回中的两个数字算出。

```mermaid
graph TD
    A["工具返回值集合 R"] --> B{"数值 v ∈ R？"}
    B -->|"是"| C["保留"]
    B -->|"否"| D{"v = a/b<br/>a,b ∈ R？"}
    D -->|"是"| E["保留（如 13/21→61.9%）"]
    D -->|"否"| F["🛑 拦下 + 记 hallucinations"]
    A --> G{"工具全失败？"}
    G -->|"是"| H["数值型事实一律不保留"]

    style C fill:#c8e6c9
    style E fill:#c8e6c9
    style F fill:#ffcdd2
    style H fill:#ffcdd2
```

**实测案例**：
- 21（返回里有）→ 保留
- 61.9（=13/21，base 在返回里）→ 保留
- 999（编的）→ 🛑 拦下
- 工具全失败 → 数值型事实一律不保留

来源绑定按"最具体目标"取一类：带扩展名文件名 > URL > owner/repo > 本库表名。判据看**调用 args 是否点到它**，不看返回文本。

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177), [HANDOFF.md:131-145](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L131-L145)

### 闸三：事实溯源（_ground_facts）

prompt 里写"不要编造数字"是**软约束**，拦不住。`_ground_facts()` 是后置硬校验：

```mermaid
sequenceDiagram
    participant Agent as Voyager Agent
    participant Tool as VLML 工具
    participant Guard as _ground_facts
    participant Store as 技能库

    Agent->>Tool: 调用工具取数
    Tool-->>Agent: 返回原始数据 R
    Agent->>Agent: 生成回答（含数值 v1, v2, ...）
    Agent->>Guard: 提交回答 + 原始数据 R
    Guard->>Guard: 逐值检验 vi ∈ R 或 vi = f(a,b)
    alt 全部通过
        Guard-->>Store: 写入技能库
    else 存在幻觉值
        Guard-->>Agent: 丢弃 + 记 hallucinations
        Note over Guard: 面板可观测
    end
```

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

## 消费侧 vs 学习侧：尺子只放一边

### 设计铁律

**学习侧不判分**（练习），**只有消费侧判分**。这是架构级约束，不是实现细节。

> 判分的尺子不能进学习反馈环，否则它学会的是"讨好裁判"。

Sources: [HANDOFF.md:150-167](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L150-L167), [docs/README-学习机制详解-2026-10-13-存档.md:728-834](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L728-L834)

### 两层归属对比

| 层 | 归属 | 读什么 | 用途 |
|---|---|---|---|
| **判据层** | Voyager（它在学习） | `ev.success` 布尔 | 存技能 / 停止同题 / 推进换题 / 迁移考核 |
| **掌握度层** | 伴学（评估量尺） | mastery_v2 五档 | 评估能力，不进反馈环 |

Sources: [docs/README-学习机制详解-2026-10-13-存档.md:728-834](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L728-L834)

### 消费侧两条入口的完整度差异

| 入口 | 接了哪几闸 | 缺什么 |
|---|---|---|
| `voyager_vlml/consume.py`（VLML 消费线） | **闸三** `has_real_data`（`:2419/2462/2575/3049`） | `source_binding` / 搬运判据 / `reason_demos` 全 0 |
| `mve/coach.py:528 explain`（面板聊天 + 人导入） | **一闸都没接**：`has_real_data|is_vacuous|needs_data` 命中 **0** | 真空防线 + 来源绑定 + 搬运判据 + 示范召回，全缺 |

**修的方向**：把这两条入口补齐（先 coach.explain 的真空防线，它最薄）。**绝不是**"让两侧判据一致"——那会破坏「尺子不进反馈环」的设计。

Sources: [HANDOFF.md:150-167](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L150-L167)

## 判卷流程：从观察到判定

### 原版 vs MVE 判卷对照

```mermaid
graph TD
    subgraph 原版Voyager
        A1["action 执行 JS 代码"] --> B1["解释器产出 events"]
        B1 --> C1["critic 读原始 events 判定"]
        C1 --> D1["summarize_chatlog<br/>（判定之后才生成）"]
    end

    subgraph MVE
        A2["Voyager 调 VLML 工具"] --> B2["工具返回原始数据"]
        B2 --> C2["三闸过滤"]
        C2 --> D2["critic 读过滤后证据判定"]
        D2 --> E2["narrator 叙事<br/>（只收 covered 事实）"]
    end
```

**关键差异**：原版是"原件进判定"，MVE 早期是"誊抄本进判定"——已做两处无损修复：

1. `trajectory` 补回 `result`（之前只存 tool+args，把响应丢了）
2. `got_value is None` → 记 `未取到值：模型交了 null`，不再进值比对（交白卷 ≠ 答错）

Sources: [进度对照.md:591-708](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L591-L708), [docs/README-学习机制详解-2026-10-13-存档.md:1690-1732](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L1690-L1732)

### 判错处理铁律

| 机制 | 原版出处 | MVE 落点 |
|---|---|---|
| 题内重做，最多 N 次 | `voyager.py:269-273` | 每轮把 critique 回灌 |
| **做对就停** | `or success` | `run_mve.py` 判 correct 后 `break` |
| **只有成功才写技能库** | `voyager.py:351` | `learn()` 判错 → 不固化做法 |
| 失败只记缺口、换题 | `curriculum.py:337-341` | 缺口进 `run_log.last_missing` |
| 错题未消化 → 掌握度封顶 | 伴学 `mastery_v2.py:283-288` | `unresolved_wrong_mastery_cap=0.79` |

**为什么判错不能写技能库**：这次的做法已被裁判证明是错的，写进去就是往库里埋雷。实测反例：pistol_eco_pattern 攒下错经验后，后面几轮一直被它带偏，覆盖率从 80% 掉到 45%。

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

## 防膨胀：技能库是 dict 不是 list

| 原仓库做法 | 出处 | MVE 落点 |
|---|---|---|
| `dict[program_name]`，同名 **覆盖** | `skill.py:add_new_skill` | `skill_store.add()` → `added / rewritten / skipped` |
| 检索只取 `k=min(count, retrieval_top_k)`（=5） | `skill.py:retrieve_skills` | `skill_store.retrieve(top_k=5)` |
| 无用技能直接不入 | `skill.py:add_new_skill` | 少于 12 字 / 相似度 ≥0.90 → 丢弃 |
| qa_cache 命中就不新写 | `curriculum.py:run_qa` | 同名或相似度 ≥0.62 → 覆盖 |
| completed 里删掉 failed | `curriculum.py:clean_up_tasks` | 成功经验覆盖同题失败教训 |

**可观测指标**：`skill_store.stats()` 给出 `bloat = 累计写入 / 实际条目`。改之前 15 次写入 → 15 条（1.0，一次都没挡住）；改之后 3 次写入 → 2 条（1.5）。

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

## 防幻觉：回灌机制

### 回灌什么：代码全文，不是函数名

| 原仓库做法 | 出处 | MVE 落点 |
|---|---|---|
| 回灌 **代码全文** | `action.py:render_human_message` | `_note_attempt()` 记下含失败调用的 SQL 原文 |
| 缺失项显式写 `No code / No error / None` | 同上 | `_render_observation()` 四项全部显式写 None |
| 解析失败 retry=3 + 严格断言 | `action.py:process_ai_message` | `_validate_plan()` 工具名白名单 + 重试 3 次 |
| 事件里出现 `onError` 直接判失败 | `critic.py:39-42` | 工具全挂 → 跳过抽取 |
| 只出可验证的题 | `curriculum.txt` 第 8 条 | `answer_spec` 确定性 SQL |

**最关键的修复**：原来只回灌工具名（`query_sql`），模型看不到自己上轮写了什么 SQL，只能重新生成一遍——实测**连犯三轮同一个 `team_name` 错**，覆盖率卡在 60% 不动。改成回灌 SQL 原文 + 表结构探测后：

```
覆盖率轨迹 : 60% → 100% → 100%
```

Sources: [进度对照.md:90-177](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L90-L177)

## 知识图谱注入：control_primitives 的等价物

### 为什么原版 Voyager 能写出能跑的 JS

原版 `render_system_message()` 把 **control_primitives 的源码** 拼进 system message——模型看到的不只是"有哪些函数"，而是每个函数**怎么实现的**。MVE 之前缺两样：

| | 原版 | MVE（改之前） |
|---|---|---|
| 技能/工具说明 | 函数**源码** | 只有工具签名 + 几张表的列名 |
| 指标怎么算 | 源码里写着 | **完全没有** |
| 进没进 prompt | 一直在 system 里 | **一行都没进** |

### 图谱做细了什么

```mermaid
graph TD
    A["KnowledgeGraph"] --> B["维度节点"]
    A --> C["工具节点"]
    A --> D["表节点"]

    B --> B1["semantics: 指标怎么算"]
    B --> B2["recipe: SQL 结构骨架"]
    B --> B3["columns_by_table: 每张表用哪些列"]
    B --> B4["value_columns: 取结果第几列"]
    B --> B5["typical_errors: 典型错法"]

    D --> D1["真实列名"]
    D --> D2["grain: 粒度"]
    D --> D3["建表语句"]

    style A fill:#e1f5fe
    style B fill:#fff3e0
    style C fill:#fff3e0
    style D fill:#fff3e0
```

**泄题边界**：SQL 里所有字符串字面量一律抹成 `'?'`——给口径、给结构，不给答案。

图谱注入总开关：`MVE_GRAPH=0` 时回到"没有 control_primitives"的基线，用于 A/B 对照。

Sources: [mve/voyager.py:758-828](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/voyager.py#L758-L828), [知识图谱与求助闭环.md:185-298](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L185-L298)

### A/B 实测结果

同一道题 corrode_collapse，第 1 轮，`--help-policy=never`：

| | A：无图谱 | B：图谱只作提示 | D：图谱 + 分层硬断言 |
|---|---|---|---|
| 首血转换率 | 0.0（没算出） | **25.0 ✓** | 25.0 ✓ |
| 连败 SQL 结构 | 列都错了 | 正确 gaps-and-islands | 正确：内外层分离 |
| 连败值 / 起点 | 5 / 2 | 13 / 1 | 13 / 1 |

Sources: [知识图谱与求助闭环.md:185-298](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L185-L298)

## 求助闭环与掌握度折扣

### 闭环流程

```mermaid
sequenceDiagram
    participant V as Voyager
    participant C as Critic
    participant H as decide_help
    participant E as VLML0 解释
    participant M as 掌握度

    V->>C: 提交答案
    C-->>V: 判错 + gap
    V->>H: decide_help(gap)
    alt gap 非空（点名但没试过的工具）
        H-->>V: 不求助，先自己试（硬规则）
    else gap 为空
        H->>E: 求助
        E-->>V: 只带回做法，不给数值
        Note over E,V: 给数值=泄题
        V->>V: 带解释重做
        V->>C: 重提交
        C-->>M: 掌握度重算（打 0.85 折）
    end
```

**求助纪律（硬规则）**：`gap`（点名但没试过的工具）非空时直接返回不求助，不问模型。第一次完全交给模型时，它说"我已经尝试了所有点名的工具"（其实一个都没试）。

Sources: [知识图谱与求助闭环.md:185-298](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L185-L298), [进度对照.md:678-795](https://github.com/Zxy876/voyager-vlml-mve/blob/main/进度对照.md#L678-L795)

### 掌握度折扣：伴学口径

| 位置 | 规则 |
|---|---|
| `mastery_v2.py:36`/`:391-396` | `hint_used_modifier=0.85` → 得分**打 0.85 折** |
| `mastery_retention.py:46-51` | 只有 `correct 且 used_hint=False` 才拉长半衰期；用了解释 → **半衰期不动** |

即**打折但不加速遗忘**，不是惩罚，是不计全功。

### 对照实验

| 情形 | mastery | 半衰期（3.0 起） |
|---|---|---|
| 自己答对 | 0.6057 | 3.0 → 3.588（拉长） |
| 借助帮助答对 | **0.5148** | 3.0 → 3.000（不动） |
| 答错 | — | 3.0 → 2.706（缩短） |
| 旧行为（恒 None） | 0.6057 | — |

`0.6057 × 0.85 = 0.5148`。旧行为的值等于"自己答对"——此前求助得来的答对一直按"全靠自己"计分，掌握度虚高。

Sources: [知识图谱与求助闭环.md:185-298](https://github.com/Zxy876/voyager-vlml-mve/blob/main/知识图谱与求助闭环.md#L185-L298)

## 论文对照：学术佐证

### LLM-as-a-Judge（2306.05685）

| 论文发现 | MVE 对应机制 |
|---|---|
| GPT-4 判官与人类一致率 >80% | 判官用 LLM + 确定性闸门，不追求零漏检 |
| 位置偏差（换序判词会翻） | 换序判两次，两次一致才算数 |
| 冗长偏差（塞复读清单骗过判官） | `_ground_facts()` 硬校验数值来源 |
| 数学/推理题判不动 | reference-guided judge：先独立生成参考答案再放进判词 prompt |
| few-shot judge 提升一致性 | `reason_demos` 示范库提供判例 |

### Text-to-SQL Test Suites（2010.02840）

| 论文发现 | MVE 对应机制 |
|---|---|
| 单库对答案有假阳性 | 换值回测：技能入库后用 `:slot` 换真实实体值经 `_refill_sql` 重放 |
| neighbor queries 区分语义 | 同构生成测试题（`gen_testset.py`），只换数据不换逻辑 |
| fuzzing + 蒸馏测试套件 | 不做随机库 fuzzing（没有 gold SQL），但用多场景实测覆盖 |

**一句话总结**：论文一证明"LLM 判官可用但会抖，要用机制校准"；论文二证明"答对一次不算会，要在一组扰动输入上都对才算会"。

Sources: [docs/判官与技能真实性验证_会议纪要与论文对照.md:1-77](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/判官与技能真实性验证_会议纪要与论文对照.md#L1-L77)

## 高频陷阱速查

| 陷阱 | 根因 | 防法 |
|---|---|---|
| 真空成功 | 空表聚合出 `(NULL, 0)` 骗过判据 | 取到数必须含真实值；`bool` 是 `int` 子类 |
| `needs_data` 单参 | 恒 False = 真空防线失效 | 必须传 `has_env` 第二参 |
| 白名单不同步 | 接新原语族只加一处 | 注册 ≠ 注入，两处都加 |
| 判词字段蒸发 | 加了字段没加白名单 | `coach._log_import` 与 `save_progress_codes` 白名单 |
| 局部 import 同名 | `UnboundLocalError` | 避免局部 import 与模块级同名 |
| 覆盖率卡住不动 | 只回灌工具名不回灌 SQL 原文 | 回灌 SQL 全文 + 表结构探测 |

Sources: [HANDOFF.md:131-145](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L131-L145)

## 总结

防幻觉三闸与判卷体系是 MVE 框架的信任基石。其核心设计可归纳为三点：

1. **三闸递进**：真空防线（有没有取到真数）→ 来源绑定（数从哪来）→ 事实溯源（数对不对），任一闸拦下即丢弃，不进技能库。
2. **尺子单放**：学习侧只做过程控制（驱动闭合计数/技能入库），消费侧才判分——防止模型学会"讨好裁判"。
3. **图谱常驻**：知识图谱作为 control_primitives 的等价物注入 prompt，提供指标语义/列名/典型错法，与求助（临时、打折扣）分工明确。

该体系的设计直接源自 Voyager 原版的 critic + skill 机制，并对照两篇论文的防误判策略进行了工程化落地。实测表明：三闸修复后，同场景闭合率从 0/9 提升至 6/9，技能库正常入库，示范库有效积累。

# 助产士追问骨架与课程体系

## 概述

助产士追问骨架（Maieutic Scaffolding）是 MVE 项目中将一段粗糙材料拆解为**必须回答的维度**与**预判的漂移模式**的核心机制。其设计源自原版 Maieutic 系统的 `scaffolding.ts` 与 `intent-diff.ts`，经同构映射后服务于 MVE 的学习闭环：骨架生成 → 维度逐个闭合 → 技能入库 → 里程碑点亮。与原版 Voyager 的 `decompose`（产出动宾格式操作步骤，服务于 `reachability()` 词面匹配）不同，Maieutic 骨架产出的是**可回答的具体问题**，适用于知识型/本机型场景，两条路径在 `task_decompose.plan` 中汇合。

Sources: [mve/maieutic_scaffold.py:1-83](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/maieutic_scaffold.py#L1-L83), [docs/maieutic-外包课程规划.md:302-349](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/maieutic-外包课程规划.md#L302-L349)

课程体系（Curriculum）围绕骨架产出的里程碑与维度构建，通过 `curriculum_auto.py` 管理课程账与实查清单，配合 `scene_learn.py` 的驾驶舱调度实现里程碑点亮、冷却换题与自由出题降级。骨架**只生成一次、永不因失败重拆**——这是保证闭合账可对账的铁律。

Sources: [HANDOFF.md:49-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L123), [docs/README-学习机制详解-2026-10-13-存档.md:661-752](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/README-学习机制详解-2026-10-13-存档.md#L661-L752)

## 骨架产出的三样东西

`SCAFFOLD_SYSTEM` 提示词要求模型针对输入材料产出以下三部分：

### 里程碑（milestone）

整份骨架本身就是一个**里程碑**——一个能被命名、能被判"达成了没有"的能力单元，同构课程里的一章/一个单元。

| 字段 | 要求 | 反例 |
|---|---|---|
| `name` | 像教材单元标题的短语 | "回答以下问题" / 原问题原样抄一遍 |
| `why` | 为什么把它算一个里程碑（答清它之后能力上多了什么） | 空话 |

**关键约束**：里程碑**只在骨架生成时产出一次**，运行时不再生成——运行时做的只是把 dimensions 一条条闭合。因此 `name` 必须能撑住"以后复用它"这件事。

Sources: [mve/maieutic_scaffold.py:50-65](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/maieutic_scaffold.py#L50-L65)

### 维度（dimensions）

要真正答清楚问题，**必须先做出承诺/必须回答**的具体问题。每条都必须是可回答、可判对错的具体问题，不是笼统标签。

| 合格示例 | 不合格示例 |
|---|---|
| 「阿斯伯格与孤独症在语言发育上的区别是什么？」 | 「处理边界情况」 |
| 「X 的官方诊断标准是怎么规定的？」 | 「可能回答不完整」 |

**维度数量与问题复杂度成比例**：

| 复杂度 | 维度数 | 说明 |
|---|---|---|
| 一句话能答清 | 2-3 条 | 简单问题 |
| 需要多角度（定义/机制/区别/适用条件/常见误解） | 5-7 条 | 复杂问题 |

**不要固定条数**，凑数就是仪式感。

Sources: [mve/maieutic_scaffold.py:66-78](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/maieutic_scaffold.py#L66-L78)

### 预期漂移（expected_drifts）

这题最可能出现的偏差模式，分三类（定义不许改）：

| 类型 | 定义 | 是否算错误 |
|---|---|---|
| `drift` | 答得比问题要求的少，或漏掉了某个维度 | ✅ 是偏差 |
| `revision` | 换了一种仍然满足承诺的做法 | ❌ **不是错误**，不要当缺点报 |
| `bug` | 想答对但事实上错了（编数字、张冠李戴、混同相似概念） | ✅ 是错误 |

每条必须**针对这道题**，例如「把阿斯伯格当成孤独症的一个'轻度版本'来答」是合格的 drift，而「可能回答不完整」是不合格的。

Sources: [mve/maieutic_scaffold.py:79-83](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/maieutic_scaffold.py#L79-L83), [mve/maieutic_scaffold.py:28-34](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/maieutic_scaffold.py#L28-L34)

## 骨架硬约束

```text
1. 维度必须可回答：要么能靠检索/取数回答，要么能靠明确定义与权威说法回答
2. 不要造出材料里没有的具体数字/专名；需要外部事实时写成「X 的官方标准是什么？」
3. 如果材料太模糊（比如只有两个字），照样产出骨架，并在 material_note 里如实说明
4. 维度数量与复杂度成比例，不许固定条数
```

Sources: [mve/maieutic_scaffold.py:66-83](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/maieutic_scaffold.py#L66-L83)

## 为什么不直接塞进 DECOMPOSE_SYSTEM

原版 Voyager 的 `decompose` 产出**动宾格式的操作步骤**（"Get X" / "Rank by Y"），那是为了 `reachability()` 的词面匹配——拿它去撞表名/条目名。知识型问题没有表可撞，用动宾格式只会拆出 "Get definition of X" 这种空壳（实测就 1 条）。

因此设计为**双路径**：

| 场景类型 | 拆解方式 | 产出形态 |
|---|---|---|
| 数据/库场景 | 原版 `decompose` | 动宾格式操作步骤 |
| 本机/知识型场景 | Maieutic 维度 | 可回答的具体问题 |

两条路都在 `task_decompose.plan` 里汇合，执行层/critic 拿到的形状是一样的。

Sources: [mve/maieutic_scaffold.py:35-45](https://github.com/Zxy876/voyager-vlml-mve/blob/main/mve/maieutic_scaffold.py#L35-L45)

## MVE 同构映射

原版 Maieutic 概念到 MVE 的映射关系：

| 原版概念 | MVE 对应 |
|---|---|
| 学生写的 spec | 人导入的那句话（材料） |
| `spec_gate_dimensions` | 课程要逐个回答的**维度**（= 学习子目标） |
| `expected_divergences` | 执行层的「别这么答」清单 + critic 的判据 |
| drift 判定 | critic：答案少了某个维度 = drift = 这轮没学会 |

## 完整流水线

骨架在 MVE 学习闭环中的位置与数据流：

```mermaid
flowchart TD
    A[人导入问题] --> B[生成追问骨架]
    B --> C[产出里程碑+维度+漂移]
    C --> D[Voyager首轮回答]
    D --> E{maieutic_gate判定}
    E -->|未闭合| F[maieutic追问]
    F --> G{内层重试≤4次}
    G -->|仍失败| H[追问升格为新维度]
    H --> B2[重规划: scaffold追加维度]
    B2 --> D
    G -->|闭合| I[维度闭合→技能入库]
    E -->|闭合| I
    I --> J{所有维度闭合?}
    J -->|是| K[里程碑点亮]
    J -->|否| D
    K --> L[落库: skill_store.json]
```

Sources: [docs/maieutic-外包课程规划.md:302-349](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/maieutic-外包课程规划.md#L302-L349), [HANDOFF.md:49-66](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L49-L66)

### 流水线各步骤详解

| # | 步骤 | 执行者 | 产物 | 落点 |
|---|---|---|---|---|
| 1 | 人导入问题 | 人（面板「交给 Voyager 回答」） | `topic_id`、`import_id` | `coach` → `tasks.infer_topic()` |
| 2 | 出追问骨架+调研 | maieutic | `dimensions` / `expected_drifts` / `milestone` / `material_note` | `ckpt_maieutic/<scene>/<hash>.json` |
| 3 | Voyager 首轮回答 | Voyager | `obs1` + `crit1`；`maieutic_gate` 返 `complete=False` + `questions` | `learn_orchestrate.py` |
| 4 | maieutic 追问（内层） | maieutic | `progress.iterations[dim].{asked, rounds, passed}` | 最多 `SUBTASK_MAX_RETRIES=4` 轮 |
| 5 | 追问升格为新维度+重规划（外层） | maieutic | 新 `_d` 追加进 `_dims` | `ckpt_maieutic/<scene>/<hash>_r<n>.json` |
| 6 | 闭合→一条维度一条技能 | Voyager | `skill_store.json` 一条技能，`name=dim.id` | `learn_milestone_skills` |
| 7 | 落 db | maieutic + Voyager | `problem` / `plan_ref` / `recipe` | 建模表 |

Sources: [docs/maieutic-外包课程规划.md:302-349](https://github.com/Zxy876/voyager-vlml-mve/blob/main/docs/maieutic-外包课程规划.md#L302-L349)

## 两层调度与骨架的关系

MVE 采用两层调度架构，骨架在子目标层发挥核心作用：

```mermaid
flowchart TD
    subgraph 整题层
        A[learn: 里程碑循环] --> B{任务失败?}
        B -->|是| C[挂冷却+降级自由出题]
        B -->|否| D[推进下一里程碑]
    end
    subgraph 子目标层
        E[inference: 维度循环] --> F[逐维度重试]
        F --> G{维度闭合?}
        G -->|是| H[技能入库]
        G -->|否| I[critique反馈+重试]
    end
    A --> E
    H --> A
```

| 层 | 原版语义 | MVE 落地 |
|---|---|---|
| 整题层 | `learn()`：任务失败进 `failed_tasks`，换题 | 里程碑：失败 → `note_milestone_round(new_closed=0)` 挂冷却 → 降级自由出题 |
| 子目标层 | `inference()`：`while sub_goals`，题内不跳过 | 维度：逐维度重试 |

Sources: [HANDOFF.md:97-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L97-L123)

### 三个铁律

1. **原版没有「整题总验收」层**——`inference()` 的完成判据只是"最后一条子目标成功"
2. **对做不出的任务从不原地无限重试**——单任务封顶 `action_agent_task_max_retries=4`，MVE 已封顶 4 次 + 冷却（`MAX_RETRY_STREAK = 4`）
3. **骨架拆一次就固定，永不因失败重拆**——曾按失败指纹重拆 → 维度 id 每轮变 → 闭合账全对不上

Sources: [HANDOFF.md:97-123](https://github.com/Zxy876/voyager-vlml-mve/blob/main/HANDOFF.md#L97-L123)
